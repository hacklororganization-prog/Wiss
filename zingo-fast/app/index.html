 const comps=plan.replace?[]:App.comps.map(c=>Object.assign({},c)),wires=plan.replace?[]:App.wires.map(w=>({a:w.a,b:w.b,col:w.col||''}));
 const byId=new Map(comps.map(c=>[c.id,c]));
 const R={part:r=>{if(r==null)return null;r=String(r).trim();if(r[0]==='#'){const k=r.slice(1);if(/^\d+$/.test(k))return byId.get(+k)||refs.get(k)||null;return refs.get(k)||null}return refs.get(r)||comps.find(c=>c.name===r)||null}};
 R.pin=s=>{s=String(s||'');const i=s.lastIndexOf('.');if(i<1)return null;const c=R.part(s.slice(0,i));if(!c)return null;const j=aiPinIdx(TY[c.ty],s.slice(i+1));return j<0?null:c.id+'.'+j};
 const newDefs=[];
 for(const a of(plan.actions||[]).slice(0,240)){if(!a||typeof a!=='object')continue;const lab=a.ref||a.part||a.type||'';
  if(a.do==='add'){const T=TY[a.type];if(!T||T.bb){errs.push(t('ai_x_type',{type:a.type}));continue}
   const f=featureOfPart(a.type);if(f&&!Entitlement.can(f)){errs.push(t('ai_x_locked',{part:t('p_'+a.type)}));continue}
   const c={id:uid++,ty:a.type,x:0,y:0,r:((a.rot|0)%4+4)%4};Object.assign(c,aiCleanProps(T,Object.assign({},a.props,a.name?{name:a.name}:{}),errs,lab));
   if(T.ard)c.code=SKETCHES[0].code;comps.push(c);byId.set(c.id,c);if(a.ref)refs.set(String(a.ref).replace(/^#/,''),c);added.push(c)}
  else if(a.do==='part'){if(!Entitlement.can('partbuilder')){errs.push(t('ai_x_locked',{part:t('pb_title')}));continue}
   const d=cleanPart(Object.assign({},a.def||{},{id:'cu_'+Math.random().toString(36).slice(2,8)}));if(!d||!d.pins.length){errs.push(t('ai_x_partdef'));continue}
   newDefs.push(d);if(!TY[d.id])registerCustom(d);
   if(a.place!==false){const c={id:uid++,ty:d.id,x:0,y:0,r:0};comps.push(c);byId.set(c.id,c);if(a.ref)refs.set(String(a.ref).replace(/^#/,''),c);added.push(c)}}
  else if(a.do==='wire'){const A=R.pin(a.a),B=R.pin(a.b);if(!A||!B){errs.push(t('ai_x_pin',{a:a.a,b:a.b}));continue}
   if(A!==B&&!wires.some(w=>(w.a===A&&w.b===B)||(w.a===B&&w.b===A)))wires.push({a:A,b:B,col:''})}
  else if(a.do==='unwire'){const A=R.pin(a.a),B=R.pin(a.b);for(let i=wires.length-1;i>=0;i--){const w=wires[i];if((w.a===A&&w.b===B)||(w.a===B&&w.b===A))wires.splice(i,1)}}
  else if(a.do==='set'){const c=R.part(a.part);if(!c){errs.push(t('ai_x_part',{part:a.part}));continue}Object.assign(c,aiCleanProps(TY[c.ty],a.props,errs,a.part));delete c.burn}
  else if(a.do==='delete'){const c=R.part(a.part);if(!c){errs.push(t('ai_x_part',{part:a.part}));continue}if(isLockedComp(c))continue;
   comps.splice(comps.indexOf(c),1);byId.delete(c.id);for(let i=wires.length-1;i>=0;i--){const w=wires[i];if(w.a.startsWith(c.id+'.')||w.b.startsWith(c.id+'.'))wires.splice(i,1)}}
  else if(a.do==='code'){const c=R.part(a.part)||comps.find(x=>TY[x.ty].ard);if(!c||!TY[c.ty].ard){errs.push(t('ai_x_noboard'));continue}
   if(!Entitlement.can('arduino')){errs.push(t('ai_x_locked',{part:t('ft_arduino')}));continue}c.code=String(a.code||'').slice(0,60000);c._newCode=1}
  else errs.push(t('ai_x_do',{d:String(a.do)}))}
 aiLayout(added,comps,wires);
 return{comps,wires,errs,added,uid,newDefs}}
function aiApply(plan){
 const before=JSON.stringify(serialize(App)),pd=aiPlanDoc(plan);
 if(pd.added.length&&capBlocked(pd.added.filter(c=>!CAP_SKIP.has(c.ty)).length-(plan.replace?partCount():0))){return{errs:[t('pw_cap',{n:FREE_TIER.maxParts})],added:[],changed:false}}
 pd.newDefs.forEach(d=>{if(!CULIB.some(x=>x.id===d.id)){CULIB.push(d);Brain.learnDesign(d.name,d.desc||'','part',d,plan.q)}});if(pd.newDefs.length){pbSaveLib();buildPalette()}
 App.comps=pd.comps;App.wires=pd.wires;App.uid=Math.max(App.uid,pd.uid);if(plan.replace)App.probes=[];
 reindex();syncComps();syncWires();relayoutAll();refreshInserted();Run.dirty=true;
 const coded=App.comps.filter(c=>c._newCode);coded.forEach(c=>{delete c._newCode;delete c._noauto;try{Run.rebuild();Run.upload(c)}catch(e){}});
 const changed=JSON.stringify(serialize(App))!==before;
 if(changed){Hist.commit();updateInfo();if(pd.added.length){setSelection(pd.added.map(c=>c.id),[]);fitView();aiFlash(pd.added.map(c=>c.id))}}
 return{errs:pd.errs,added:pd.added.map(c=>c.id),changed}}
function aiFlash(ids){ids.forEach(id=>{const e=CE.get(id);if(!e)return;e.g.classList.add('ai-new');setTimeout(()=>e.g.classList.remove('ai-new'),2600)})}

/* ---------- chats: one conversation per project; clearing a chat never touches the brain ---------- */
const AIChats={map:null,
 load(){if(!this.map){this.map=Store.json(AI_KEY_CHATS)||{};if(typeof this.map!=='object'||Array.isArray(this.map))this.map={}}return this.map},
 get(cid){const m=this.load()[cid];return Array.isArray(m&&m.msgs)?m.msgs:[]},
 move(from,to){const m=this.load();if(m[from]&&!m[to]){m[to]=m[from];delete m[from];Store.set(AI_KEY_CHATS,JSON.stringify(m))}if(AI.cid===from)AI.cid=to},
 put(cid,msgs){const m=this.load();m[cid]={t:Date.now(),msgs:msgs.slice(-60).map(x=>({r:x.r,c:x.c,q:x.q,t0:x.t0,t1:x.t1,learned:x.learned,labOk:x.labOk,fid:x.fid,v:x.v,err:x.err,applied:x.applied,fix:x.fix,steps:x.steps,think:x.think,mode:x.mode}))};
  const ks=Object.keys(m);if(ks.length>40)ks.sort((a,b)=>m[a].t-m[b].t).slice(0,ks.length-40).forEach(k=>delete m[k]);Store.set(AI_KEY_CHATS,JSON.stringify(m))}};

  if(mem.length){ctx.push('LEARNED KNOWLEDGE (from earlier conversations and the Voltra community; use if relevant, verify against the snapshot):\n'+mem.map((x,i)=>'['+(i+1)+'] '+(x.design?'Design "'+(x.f.name||'')+'": '+AIT.cap(x.f.desc||x.f.a||'',200)+(x.f.data?'\n'+AIT.cap(JSON.stringify(x.f.data),500):''):'Q: '+AIT.cap(x.f.q,120)+'\nA: '+AIT.cap(x.f.a,450))).join('\n'));mem.forEach(x=>{if(x.src==='me')x.f.uses=(x.f.uses||0)+1})}
  const rules=Brain.rulesText();if(rules)ctx.push('USER PREFERENCES:\n'+rules);
  (o.extra||[]).forEach(x=>ctx.push(x));
  return ctx.join('\n\n')},
 history(n){const hist=[];let budget=n||3500;for(let i=this.chat.length-3;i>=0&&budget>0;i--){const x=this.chat[i];if(x.err||x.pending||x.r==='s')continue;const c=x.r==='a'?aiStrip(x.c)+(aiBlocks(x.c).length?'\n[proposed actions omitted]':''):x.c;budget-=AIT.tokEst(c);if(budget<0)break;hist.unshift({role:x.r==='u'?'user':'assistant',content:AIT.cap(c,900)})}return hist},
 async call(sys,msgs,onText,temp){return AIRun.stream(this.cfg,sys,msgs,onText||(()=>{}),this.ctrl.signal,{temp})},

 /* ---- conversation ---- */
 async ask(q,o){o=o||{};q=String(q||'').trim();if(!q||this.busy)return;

  let mode=o.mode||this.cfg.mode;if(!this.modeOk(mode)){Paywall.open('ailoop');mode='think'}

  this.chat.push({r:'u',c:q,mode,t0:Date.now()});const m={r:'a',c:'',q,pending:1,mode,steps:[],t0:Date.now()};this.chat.push(m);this.busy=true;this.render();
  const intent=aiIntent(q),sys=aiSystem(intent,mode),hist=this.history(mode==='fast'?1500:3500);

   if(mode==='fast')await this.runFast(m,q,o,sys,hist);
   else if(mode==='loop')await this.runLoop(m,q,o,sys,hist,intent);

   if(!m.c.trim())throw new Error(t('ai_e_empty'))}

 async runFast(m,q,o,sys,hist){const r=await this.call(sys,hist.concat([{role:'user',content:this.context(q,o)+'\n\nUSER MESSAGE:\n'+q}]),txt=>{m.c=aiClean(txt);this.paintLast()},.2);m.c=aiClean(r.text)},
 /* Think: plan (may ask for web searches) -> answer -> virtual lab -> up to 2 repairs -> learn when verified */
 async runThink(m,q,o,sys,hist,intent){
  const ctx=this.context(q,o);
  const s1=this.step(m,'think',t('ai_st_think'));
  const plan=await this.call(sys,hist.concat([{role:'user',content:ctx+'\n\nUSER MESSAGE:\n'+q+'\n\nTHINK FIRST (do not answer yet): in at most 8 short numbered lines, analyse the request: what is asked, the relevant facts from the snapshot, the design or fix (part values with calculations), and every connection needed. If you are missing facts that the internet would give (datasheet, pinout, formula), add up to 2 lines exactly like:\nSEARCH: <short query>'}]),txt=>{m.think=aiClean(txt);this.paintLast()},.2);
  m.think=aiClean(plan.text);this.done(m,s1,'ok');
  let web='';const qs=(m.think.match(/^\s*SEARCH\s*:\s*(.+)$/gim)||[]).map(l=>l.replace(/^\s*SEARCH\s*:\s*/i,'').trim()).filter(Boolean).slice(0,2);

  const s2=this.step(m,'write',t('ai_st_write'));
  const final=async extra=>{const r=await this.call(sys,hist.concat([{role:'user',content:ctx+(web?'\n\nWEB RESULTS:\n'+web:'')+'\n\nYOUR ANALYSIS:\n'+AIT.cap(m.think,700)+(extra||'')+'\n\nUSER MESSAGE:\n'+q+'\n\nNow give the final answer. End with one line: CONFIDENCE: <0-100> (how sure you are it is correct).'}]),txt=>{m.c=aiClean(txt);this.paintLast()},.25);return aiClean(r.text)};

   const s=this.step(m,'lab',t(round?'ai_st_relab':'ai_st_lab'));const pd=aiPlanDoc(plans[0]);const lab=aiLab(pd.comps,pd.wires,.6);
   const probs=pd.errs.map(x=>({sev:'err',msg:x})).concat(lab.issues.filter(i=>i.sev!=='info'));

   this.done(m,s3,'ok')}

 /* Loop: build on the workspace in front of the user, simulate, diagnose, repeat until clean */
 async runLoop(m,q,o,sys,hist,intent){
  if(MOB.on)MOB.close();
  let note='',last='',fixedAll=false;
  for(let it=1;it<=AI_LOOP_MAX;it++){
   AIBanner.show(t('ai_bn_work'),t('ai_bn_step',{n:it,max:AI_LOOP_MAX}));
   const s=this.step(m,'think',t('ai_st_loop',{n:it}));
   const r=await this.call(sys,hist.concat([{role:'user',content:this.context(q,o)+(note?'\n\nRESULT OF YOUR PREVIOUS STEP (applied to the workspace and simulated):\n'+note:'')+'\n\nUSER MESSAGE:\n'+q+'\n\nLOOP MODE: you are working directly on the workspace. Give the next set of changes as ONE ```zingo block (the workspace already contains your previous steps — do not rebuild what is there unless the user asked for a new circuit and this is step 1). When the circuit fully works and nothing is left to do, reply with a short summary and the line DONE (no block).'}]),txt=>{m.c=aiClean(txt);this.paintLast()},.25);
   last=aiClean(r.text);m.c=last;this.done(m,s,'ok');
   const plans=aiBlocks(last).filter(b=>!b.bad);
   if(!plans.length){if(/\bDONE\b/.test(last)||it>1){fixedAll=!aiDiagnose().some(d=>d.sev==='err');break}note='No ```zingo block was found. Give the changes as a block.';continue}
   const sa=this.step(m,'apply',t('ai_st_apply'));const pl=Object.assign({},plans[0],{q});if(it>1)pl.replace=false;

   const sv=this.step(m,'lab',t('ai_st_sim'));await new Promise(r=>setTimeout(r,1300));
   const diag=aiDiagnose(),bad=diag.filter(d=>d.sev!=='info'),rd=App.comps.filter(c=>c.ty!=='jn'&&!TY[c.ty].bb).map(c=>{const x=aiReading(c);return x?partName(c)+' '+x:''}).filter(Boolean).slice(0,10);
   if(!bad.length&&!res.errs.length){this.done(m,sv,'ok',t('ai_st_lab_ok')+(rd.length?' · '+rd.slice(0,3).join(' · '):''));fixedAll=true;
    note='Applied and simulated: no problems. Readings: '+rd.join('; ')+'\nIf everything the user asked for is done, reply with a short summary and DONE.';

  const sum=this.step(m,'done',t(fixedAll?'ai_st_loop_ok':'ai_st_loop_stop'));this.done(m,sum,fixedAll?'ok':'warn');
  if(fixedAll){Brain.me.stats.auto++;Brain.learnDesign(q.slice(0,80),aiStrip(last).slice(0,600),'circuit',{doc:JSON.parse(JSON.stringify(serialize(App)))},q);this.selfLearn(m,q,true)}},
 /* the brain keeps what proved itself: verified in the lab, or the model is confident and the answer is substantial */

 /* ---- rendering ---- */

 document.addEventListener('visibilitychange',()=>{if(document.hidden){Aud.setCont({motor:0,tone:0,short:false});saveDoc(App)}});
 window.addEventListener('pagehide',()=>saveDoc(App));
 document.addEventListener('contextmenu',e=>{if(!e.target.closest('textarea,input'))e.preventDefault()});

 setTab('props');
 Auth.load();Auth.paint();$('#bAcct').onclick=()=>Account.open();$('#bExt').onclick=()=>Market.open();
 try{await Promise.race([Entitlement.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
 if(Auth.u){try{await Promise.race([Entitlement.useKey(Auth.key()),new Promise(r=>setTimeout(r,2500))])}catch(e){}if(Auth.me)Entitlement.serverSync(Auth.me);Auth.sync()}
 syncPro();

 loadDoc(stored||buildExample(EXAMPLES[0]),true);

 if(DESK){/* desktop: files opened from Explorer / a second launch, and the window close button */
  DESK.onOpenFile(p=>Proj.openPath(p));

  DESK.ready()}
 setMode(Settings.mode);
 requestAnimationFrame(()=>{fitView();Object.assign(App.view,App.tv);applyView()});
 requestAnimationFrame(t0=>Run.frame(t0));APP_UP=true;refreshLocks();setTimeout(()=>{if(Auth.u)Life.boot()},1500);
 document.addEventListener('pointerdown',()=>Aud.ensure(),true);
 /* hide the splash once the first frame is ready */
 Ld.set(96,'ld_doc');await tick();await tick();
 Ld.set(100,'ld_ready');if(!Auth.u)Login.open();await Ld.sleep(420);Ld.hide();
})().catch(e=>{try{Run.fault(e)}catch(_){}const sp=$('#splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),600)}});
