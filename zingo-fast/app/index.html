<style>
/* ===== SECTION: theme — design tokens (dark / light), typography, layout, components ===== */
:root{
 --ui:"Inter Var","Cairo Var","Segoe UI",Roboto,system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;
 --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;
 --r1:8px;--r2:12px;--r3:18px;--top:52px;--stat:30px;--pw:270px;--dw:340px;
 --bg:#0a1017;--bg2:#0f1822;--panel:rgba(20,29,40,.82);--panel2:#16212d;--line:#263648;--line2:#1c2937;
 --ink:#e7eef6;--mut:#8a9bb0;--acc:#22d3ee;--acc2:#0ea5c6;--accink:#032229;--ok:#22c55e;--warn:#f5a524;--bad:#ef4444;
 --sy:#cfe3f5;--grid:#15202c;--grid2:#1a2836;--wc:#05080c;--wire:#7388a2;--shadow:0 8px 30px rgba(0,0,0,.45);--hov:rgba(255,255,255,.07);--sel:#22d3ee;
}
:root[data-theme=light]{
 --bg:#e9eef4;--bg2:#f6f9fc;--panel:rgba(255,255,255,.86);--panel2:#ffffff;--line:#c9d5e2;--line2:#dde6ef;
 --ink:#14202d;--mut:#586a80;--acc:#0891b2;--acc2:#0e7490;--accink:#ffffff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
 --sy:#1b2a3a;--grid:#dbe4ee;--grid2:#cfdbe8;--wc:#2b3a4b;--wire:#506783;--shadow:0 8px 26px rgba(30,50,80,.18);--hov:rgba(0,0,0,.06);--sel:#0891b2;
}
/* accent themes (dark first, then light) */
:root[data-accent=violet]{--acc:#a78bfa;--acc2:#8b5cf6;--accink:#1a0b3a;--sel:#a78bfa}:root[data-theme=light][data-accent=violet]{--acc:#7c3aed;--acc2:#6d28d9;--accink:#fff;--sel:#7c3aed}
:root[data-accent=emerald]{--acc:#34d399;--acc2:#10b981;--accink:#03271b;--sel:#34d399}:root[data-theme=light][data-accent=emerald]{--acc:#059669;--acc2:#047857;--accink:#fff;--sel:#059669}
:root[data-accent=amber]{--acc:#fbbf24;--acc2:#f59e0b;--accink:#2b1a00;--sel:#fbbf24}:root[data-theme=light][data-accent=amber]{--acc:#d97706;--acc2:#b45309;--accink:#fff;--sel:#d97706}
:root[data-accent=rose]{--acc:#fb7185;--acc2:#f43f5e;--accink:#2d0610;--sel:#fb7185}:root[data-theme=light][data-accent=rose]{--acc:#e11d48;--acc2:#be123c;--accink:#fff;--sel:#e11d48}
:root[data-accent=blue]{--acc:#60a5fa;--acc2:#3b82f6;--accink:#04152e;--sel:#60a5fa}:root[data-theme=light][data-accent=blue]{--acc:#2563eb;--acc2:#1d4ed8;--accink:#fff;--sel:#2563eb}
:root[data-theme=dark][data-bg=midnight]{--bg:#05070d;--bg2:#0a0e18;--panel:rgba(12,16,26,.86);--panel2:#0f1420;--line:#1e2738;--line2:#151c2a;--grid:#0f1520;--grid2:#141c2a}
:root[data-theme=dark][data-bg=graphite]{--bg:#121314;--bg2:#18191b;--panel:rgba(30,31,34,.86);--panel2:#202124;--line:#34363a;--line2:#2a2c30;--grid:#1c1d20;--grid2:#232428}
:root[data-density=compact]{--top:46px;--stat:26px}
:root[data-motion=off] *,:root[data-motion=off] *::before,:root[data-motion=off] *::after{animation-duration:0s!important;transition-duration:0s!important}
.acc-dots{display:flex;gap:6px;flex-wrap:wrap}.acc-dots button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line)}.acc-dots button[aria-pressed=true]{border-color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);-webkit-user-select:none;user-select:none}
#app{position:relative;height:100vh;min-width:1024px;min-height:600px;display:flex;flex-direction:column}
.mono,input.num,.rd,#stTime,#stInfo{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,.dis{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* top bar */
#top{height:var(--top);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand .i{color:var(--acc)}
.grp{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel2)}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 8px;border:1px solid transparent;border-radius:var(--r1);background:transparent;transition:background .12s,color .12s,transform .08s}
.ib:hover{background:var(--hov)}
.ib:active{transform:scale(.94)}
.ib.on,.ib[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.ib.pri{background:var(--acc);color:var(--accink)}
.ib.pri:hover{background:var(--acc2)}
.ib.dng{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel2);transition:background .12s,transform .08s}
.btn:hover{background:var(--hov)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.dng{border-color:var(--bad);color:var(--bad)}
.seg{display:flex;padding:3px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel2);gap:2px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:var(--r1);background:transparent;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink);font-weight:600}
select,input[type=text],input[type=search],input.num,textarea.ta{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel2);min-width:0}
select{padding-inline-end:6px}
#sSpd{height:30px;border:0;background:transparent}
/* work area */
#work{flex:1;min-height:0;display:grid;grid-template-columns:var(--pw) minmax(0,1fr) auto;position:relative}
#parts{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-inline-end:1px solid var(--line);z-index:20}
.search{display:flex;align-items:center;gap:6px;margin:10px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);color:var(--mut)}
.search input{flex:1;height:38px;border:0;background:transparent;outline:0;color:var(--ink);-webkit-user-select:text;user-select:text}
#plist{flex:1;min-height:0;overflow:auto;padding:0 10px 14px;overscroll-behavior:contain}
.cat{margin-bottom:6px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel2);overflow:hidden}
.cat>button{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 12px;border:0;background:transparent;font-weight:600;text-align:start}
.cat>button .i{transition:transform .15s;width:16px;height:16px}
.cat.open>button .i{transform:rotate(90deg)}
:root[dir=rtl] .cat>button .i{transform:scaleX(-1)}
:root[dir=rtl] .cat.open>button .i{transform:scaleX(-1) rotate(90deg)}
.cat .cnt{color:var(--mut);font-weight:400;font-size:12px;margin-inline-start:6px}
.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;padding:6px}
.cat.open .grid{display:grid}
.it{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px;border:1px solid transparent;border-radius:var(--r1);background:transparent;font-size:11px;line-height:1.2;text-align:center;color:var(--mut);touch-action:pan-y}
.it:hover{background:var(--hov);border-color:var(--line);color:var(--ink)}
.it:active{transform:scale(.96)}
.it svg.th{width:64px;height:46px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r1)}
.empty{padding:20px;text-align:center;color:var(--mut)}
/* stage */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg2)}
#board{position:absolute;inset:0;direction:ltr;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:15px 15px}
#cv{width:100%;height:100%;display:block;touch-action:none;outline:0;cursor:default}
#board.pan #cv{cursor:grab}#board.panning #cv{cursor:grabbing}#board.probe #cv{cursor:crosshair}
#tools{position:absolute;inset-inline-start:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#tools .grp{flex-direction:column;box-shadow:var(--shadow);background:var(--panel);}
#selbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;box-shadow:var(--shadow);background:var(--panel);animation:mIn .18s ease-out}
#selbar[hidden]{display:none}
#selbar .dng{color:var(--bad)}
/* dock */
#dock{width:var(--dw);display:flex;flex-direction:column;min-height:0;background:var(--panel);border-inline-start:1px solid var(--line);z-index:20}
#dock.wide{width:min(560px,46vw)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;align-items:center}
.tabs button.tab{flex:1;height:36px;border:0;border-radius:var(--r1) var(--r1) 0 0;background:transparent;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabpane{flex:1;min-height:0;overflow:auto;padding:12px;display:none;overscroll-behavior:contain}
.tabpane.show{display:flex;flex-direction:column;gap:12px}
#tabCode.show{padding:0;gap:0;overflow:hidden}
.sec{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel2)}
.sec h4{margin:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;min-height:34px}
.row>label{flex:0 0 38%;color:var(--mut);font-size:13px}
.row>.ctl>output,.row>.ctl>.val{flex:none;min-width:3.2em;text-align:end}
.row>.ctl{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.row input.num,.row select,.row input[type=text]{flex:1;width:100%}
.row input[type=range]{flex:1;min-width:0;width:0;accent-color:var(--acc);height:28px}
.sw{position:relative;width:44px;height:26px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);padding:0}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:color-mix(in srgb,var(--acc) 30%,var(--bg2));border-color:var(--acc)}
.sw[aria-checked=true]::after{background:var(--acc);transform:translateX(18px)}
:root[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-18px)}
.rd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.rd b{color:var(--mut);font-weight:400}
.rdr{display:contents}.rdr[hidden],#rrS[hidden]{display:none}
.bbo{fill:none;stroke:var(--sy);stroke-opacity:.25;stroke-dasharray:4 4}
.bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;border:1px solid var(--line2)}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s,background .2s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.dot[aria-pressed=true]{border-color:var(--ink)}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:24px 10px}
/* editor */
#edTop{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line2);flex-wrap:wrap;align-items:center}
#edTop select{flex:1;min-width:90px}
.ed{flex:1;min-height:120px;position:relative;display:flex;direction:ltr;background:var(--bg2);overflow:hidden;font:13px/20px var(--mono)}
.gut{flex:none;width:42px;overflow:hidden;text-align:right;padding:8px 8px 8px 0;color:var(--mut);border-right:1px solid var(--line2);background:var(--panel2);white-space:pre;position:relative}
.gut div{height:20px}.gut div.err{background:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--ink)}
.cw{position:relative;flex:1;min-width:0}
.cw pre,.cw textarea{position:absolute;inset:0;margin:0;padding:8px 10px;font:inherit;tab-size:2;white-space:pre;border:0;overflow:auto;letter-spacing:0;word-spacing:0}
.cw pre{pointer-events:none;overflow:hidden}
.cw textarea{background:transparent;color:transparent;caret-color:var(--ink);outline:0;resize:none;-webkit-user-select:text;user-select:text;direction:ltr;text-align:left}
.cw textarea::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
.errl{position:absolute;inset-inline:0;height:20px;background:color-mix(in srgb,var(--bad) 22%,transparent);pointer-events:none;display:none}
.tk-c{color:#6b8aa6;font-style:italic}.tk-s{color:#7ee0a2}.tk-n{color:#f5b86b}.tk-p{color:#c792ea}.tk-k{color:#4fc3f7;font-weight:600}.tk-f{color:#ffd37a}.tk-k2{color:#ff8fa3}
:root[data-theme=light] .tk-c{color:#6b7f95}:root[data-theme=light] .tk-s{color:#0d7a3e}:root[data-theme=light] .tk-n{color:#b45309}:root[data-theme=light] .tk-p{color:#7c3aed}:root[data-theme=light] .tk-k{color:#0369a1}:root[data-theme=light] .tk-f{color:#a16207}:root[data-theme=light] .tk-k2{color:#be123c}
#ser{display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:0;height:170px;flex:none;background:var(--panel2)}
#serHead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:var(--mut);font-size:12px}
#serOut{flex:1;margin:0;padding:6px 10px;overflow:auto;font:12px/1.5 var(--mono);direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;-webkit-user-select:none;user-select:none}
#serIn{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line2)}
#serIn input{flex:1;font-family:var(--mono);direction:ltr}
#edMsg{padding:6px 10px;font-size:12px;min-height:26px;color:var(--mut);border-top:1px solid var(--line2);font-family:var(--mono);direction:ltr;text-align:left}
#edMsg.bad{color:var(--bad)}
/* scope */
#scopeP{position:absolute;inset-inline-start:64px;bottom:12px;width:min(420px,calc(100% - 80px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);display:none;flex-direction:column;z-index:7;overflow:hidden}
#scopeP.show{display:flex}
#scopeP header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 12px;font-weight:600}
#scv{display:block;width:100%;height:210px;background:#04141a;direction:ltr}
.scc{display:flex;gap:6px;padding:8px;flex-wrap:wrap}
.scc label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px;flex:1;min-width:80px}
.scc select{height:30px}
/* status bar (bottom): run state pill + time + counters + hint */
#status{flex:none;height:var(--stat);display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--mut);z-index:30;white-space:nowrap;overflow:hidden}
#stState{flex:none;display:inline-flex;align-items:center;gap:7px;height:22px;max-width:220px;padding:0 10px 0 9px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stState::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--mut)}
#stState.run::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#stState.open::before,#stState.nosrc::before,#stState.nopow::before,#stState.pause::before{background:var(--warn)}
#stState.fault::before,#stState.short::before,#stState.conv::before{background:var(--bad);box-shadow:0 0 6px var(--bad)}
#stHint{overflow:hidden;text-overflow:ellipsis}
/* error bar (replaces message dialog) */
#errBar{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;background:#fde8e8;border-bottom:1px solid #f5c2c2;color:#1c1c1c;z-index:29}
[data-theme=dark] #errBar{background:#3a1a1f;border-bottom-color:#5c2a31;color:var(--ink)}
#errBar[hidden],#errList[hidden]{display:none}
#errBar .eb-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:40px;padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-align:start;cursor:pointer}
.eb-dot{flex:none;width:14px;height:14px;border-radius:50%;background:#ef2b2b}
.eb-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#errBar time{flex:none;font-weight:500;font-size:13px}
.eb-cnt{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:#e11d1d;color:#fff;font:700 13px/26px var(--mono);text-align:center;font-style:normal}
#errBar .eb-btn{color:inherit;background:transparent;border:0;min-width:40px;width:40px;height:40px}
#ebExp svg{transition:transform .2s}#errBar.open #ebExp svg{transform:rotate(90deg)}
:root[dir=rtl] #errBar:not(.open) #ebExp svg{transform:scaleX(-1)}
#errList{flex:none;max-height:38vh;overflow:auto;padding:4px 12px;background:#fff4f4;border-bottom:1px solid #f5c2c2;color:#1c1c1c;z-index:29;-webkit-user-select:none;user-select:none}
[data-theme=dark] #errList{background:#2b1519;border-bottom-color:#5c2a31;color:var(--ink)}
#errList .erow{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(239,68,68,.25)}
#errList .erow:last-child{border-bottom:0}
#errList .erow b{font-size:15px}
#errList .erow p{margin:0;font-size:13px;line-height:1.6;opacity:.85}
#errList .erow .btn{min-height:36px;height:36px;padding:0 14px}
.eb-cnt[hidden]{display:none}
/* located problem: red glow */
.wr.flag .wc{stroke:#ff1f1f!important;stroke-width:14;opacity:1;animation:flagp .55s ease-in-out infinite alternate}
.wr.flag .wl{stroke:#ff6b6b!important;filter:drop-shadow(0 0 6px #ff1f1f)}
.cp.flag{filter:drop-shadow(0 0 6px #ff1f1f) drop-shadow(0 0 14px #ff1f1f);animation:flagc .55s ease-in-out infinite alternate}
@keyframes flagp{from{opacity:.3}to{opacity:1}}
@keyframes flagc{from{opacity:.65}to{opacity:1}}
/* overlays */
#toast{position:fixed;top:calc(var(--top) + 12px);left:50%;transform:translate(-50%,-20px);max-width:min(92vw,520px);padding:10px 16px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--bad);color:var(--ink);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .i{color:var(--bad)}
.pop{position:fixed;z-index:90;min-width:190px;padding:6px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);display:none}
.pop.show{display:block}
.pop button.mi{width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:var(--r1);background:transparent;text-align:start}
.pop button.mi:hover{background:var(--hov)}
.pop button.mi.dng{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.pop .mh{padding:6px 10px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pop .mk{margin-inline-start:auto;color:var(--mut);font-size:12px;font-family:var(--mono)}
#modalBg{position:fixed;inset:0;z-index:110;background:rgba(3,8,14,.55);display:none;align-items:center;justify-content:center;padding:16px;}
#modalBg.show{display:flex}
#modal{width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border-radius:var(--r3);border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);animation:mIn .18s ease-out}
#modal h3{margin:0;padding:16px 18px 8px;font-size:17px}
#modal .mb{padding:4px 18px 12px;overflow:auto;min-height:0;-webkit-user-select:none;user-select:none}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
#modal textarea.ta{width:100%;height:220px;padding:10px;font:12px/1.4 var(--mono);direction:ltr;resize:vertical}
#modal .lst{display:flex;flex-direction:column;gap:6px}
#modal .lst button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r1);background:var(--bg2);text-align:start}
#modal .lst button:hover{border-color:var(--acc)}
#modal .lst small{color:var(--mut)}
#modal table{width:100%;border-collapse:collapse}#modal td{padding:5px 6px;border-bottom:1px solid var(--line2)}
#modal kbd{font:12px var(--mono);padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg2)}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#ghost{position:fixed;z-index:120;pointer-events:none;display:none;width:84px;height:60px;opacity:.9;background:var(--panel2);border:1px solid var(--acc);border-radius:var(--r1);box-shadow:var(--shadow)}
/* scene styling */
.sy{fill:none;stroke:var(--sy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sy.sf{fill:var(--sy)}
.st{fill:var(--sy);font-family:var(--mono)}
.wc{fill:none;stroke:var(--wc);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.wl{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.wf{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 13;opacity:.95}
.wr.sel .wl{filter:none;stroke-width:5}.wr.sel .wc{stroke:var(--sel);stroke-width:9;opacity:.75}
.wr.hot .wc{stroke:var(--bad);animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{from{opacity:.35}to{opacity:1}}
.sb{fill:none;stroke:var(--sel);stroke-width:1.6;stroke-dasharray:5 4;display:none;pointer-events:none;rx:6}
.cp.sel .sb{display:block}
body.schview #selbar,body.schview #bUndo,body.schview #bRedo,body.schview #tools .grp:first-child{display:none!important}
#gL{pointer-events:none}#gL text{fill:var(--mut);font-family:var(--ui);font-size:10.5px;font-weight:600}.pol{font-family:var(--mono);font-weight:800;pointer-events:none;paint-order:stroke;stroke:var(--bg2);stroke-width:2.6px;stroke-linejoin:round}.pol.pp{fill:#ef4444}.pol.pm{fill:#3b82f6}.pol.pl{fill:#b5651d}.pol.pn{fill:#3b82f6}.pol.pk{fill:var(--mut)}#gL text{paint-order:stroke;stroke:var(--bg2);stroke-width:3.2px;stroke-linejoin:round;stroke-opacity:.9}
.rh{cursor:nesw-resize;touch-action:none}.rhh{fill:transparent}.rhd{fill:var(--acc);stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}.rhi{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.cp.burnt .bd{opacity:.55}
.cp .bx{display:none}.cp.burnt .bx{display:block}
.pin{fill:#c9a93a;stroke:#000;stroke-opacity:.5;stroke-width:.8}.pin.ins{fill:#2fd06a}
[data-r="gl"],[data-r="bd"]{transition:opacity .12s linear,fill-opacity .12s linear,fill .12s linear}
.pin{transition:fill .15s}
.pinh{fill:none;stroke:var(--acc);stroke-width:2.4;pointer-events:none}
.pinp{fill:none;stroke:var(--acc);stroke-width:2.4}
.snapr{fill:color-mix(in srgb,var(--acc) 30%,transparent);stroke:var(--acc);stroke-width:2.4;animation:snap .5s ease-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes snap{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:.4}}
.jd{fill:var(--wire);stroke:var(--wc);stroke-width:1.4}
.pop-in .bd{animation:pin .28s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center}
@keyframes pin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cring{fill:none;stroke:var(--acc);stroke-width:3;animation:cr .55s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes cr{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.spark{fill:#ffd54a;animation:sp .45s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes sp{0%{transform:scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.flash{fill:#fff6c8;animation:fl .35s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes fl{from{transform:scale(.3);opacity:.95}to{transform:scale(2.2);opacity:0}}
.smk{fill:#778;animation:sm 1.6s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes sm{from{transform:translate(0,0) scale(.5);opacity:.6}to{transform:translate(var(--dx),-70px) scale(2.2);opacity:0}}
#board.shake{animation:shk .35s linear}

/* ===== DESKTOP SHELL (this app targets computers only) ===== */
:root{
 --top:54px;--stat:32px;--pw:292px;--dw:352px;--r1:10px;--r2:14px;--r3:16px;--ease:cubic-bezier(.2,.8,.2,1);

 --ink:#e8eef9;--mut:#8b9ab3;--acc:#38bdf8;--acc2:#0ea5e9;--accink:#04151f;
 --grid:#131d2e;--grid2:#18243a;--hov:rgba(255,255,255,.08);--shadow:0 8px 28px rgba(0,0,0,.45);
}

 --bg:#eef2f8;--bg2:#f6f8fc;--panel:#ffffff;--panel2:#ffffff;--line:#d3dce9;--line2:#e3e9f2;
 --ink:#14202d;--mut:#5a6b82;--acc:#0284c7;--acc2:#0369a1;--accink:#ffffff;
 --grid:#dde5ef;--grid2:#d0dbe8;--hov:rgba(0,0,0,.06);--shadow:0 8px 26px rgba(30,50,80,.18);
}
html,body{background:var(--bg);overflow:auto}

*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--mut)}

#top{height:var(--top);padding:0 12px;gap:10px;background:var(--panel2);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18)}

/* work area: parts | canvas | inspector */

#modal{width:min(560px,100%);max-width:560px;border-radius:16px}

#toast{border-radius:12px}

/* splash */
#splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:var(--accink);box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 40%,transparent);animation:splp 1.1s ease-in-out infinite alternate}
#splash .lg svg{width:48px;height:48px;stroke-width:2}
#splash b{font-size:20px;color:var(--ink)}
@keyframes splp{from{transform:scale(.94)}to{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#splash .lg{animation:none}}

/* ===== CONTENT LOCK: nothing can be selected / copied / dragged except inside real input fields ===== */
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"],.cw textarea{-webkit-user-select:text;user-select:text}
::selection{background:transparent}
input::selection,textarea::selection{background:color-mix(in srgb,var(--acc) 40%,transparent)}
@media (max-width:1180px){.brand b{display:none}#top{gap:6px;padding:0 8px}}
@media (max-width:1100px){:root{--pw:236px;--dw:300px}}

html{text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

.btn,.seg button,.tabs button.tab,.cat>button,.sec h4{font-weight:600}

/* ===== SECTION: engine (p3_engine.js) ===== */
const Eng=(()=>{
const VT=0.025852,GMIN=1e-12,fin=Number.isFinite;
// SPICE-style junction voltage limiting (keeps exp() well behaved)
const lim=(v,o,vt,vc)=>{if(v>vc&&Math.abs(v-o)>2*vt){if(o>0){const a=1+(v-o)/vt;v=a>0?o+vt*Math.log(a):vc}else v=vt*Math.log(v/vt)}return v};
const ex=x=>Math.exp(x>60?60:x);
const fn=x=>typeof x=='function'?x:()=>x;

/* ---- MNA system: unknowns = node voltages (1..N) then voltage-source branch currents ---- */
class Sys{
 constructor(N,K){this.N=N;this.K=K;const n=N+K;this.n=n;this.A=new Float64Array(Math.max(1,n*n));this.b=new Float64Array(Math.max(1,n));this.x=new Float64Array(Math.max(1,n));this.xn=new Float64Array(Math.max(1,n));this.dt=2e-5;this.t=0;this.sc=1;this.gm=GMIN;this.nc=false}
 v(k){return k?this.x[k-1]:0}
 gc(a,b,g){const n=this.n,A=this.A;if(a){A[(a-1)*n+a-1]+=g;if(b)A[(a-1)*n+b-1]-=g}if(b){A[(b-1)*n+b-1]+=g;if(a)A[(b-1)*n+a-1]-=g}}
 cf(a,b,I){if(a)this.b[a-1]-=I;if(b)this.b[b-1]+=I}            // constant current a->b inside an element
 inj(a,I){if(a)this.b[a-1]+=I}
 vs(a,b,k,V,Rs){const n=this.n,A=this.A,r=this.N+k;if(a){A[(a-1)*n+r]+=1;A[r*n+a-1]+=1}if(b){A[(b-1)*n+r]-=1;A[r*n+b-1]-=1}A[r*n+r]-=Rs;this.b[r]=V*this.sc}
 // linearised non-linear element: terminals T[k] receive f0[k] (+ J*(u-u0)); controls C[m]=[p,q] => u=v(p)-v(q)
 nl(T,f0,C,u0,J){const n=this.n,A=this.A;for(let k=0;k<T.length;k++){const t=T[k];if(!t)continue;let r=f0[k];for(let m=0;m<C.length;m++){const j=J[k][m],p=C[m][0],q=C[m][1];if(p)A[(t-1)*n+p-1]+=j;if(q)A[(t-1)*n+q-1]-=j;r-=j*u0[m]}this.b[t-1]-=r}}
 // Gaussian elimination with partial pivoting; false if singular / non-finite
 solve(){const n=this.n,N=this.N,A=this.A,b=this.b,x=this.xn,gm=this.gm;if(!n)return true;
  for(let i=0;i<N;i++)A[i*n+i]+=gm;
  for(let c=0;c<n;c++){let p=c,m=Math.abs(A[c*n+c]);for(let r=c+1;r<n;r++){const a=Math.abs(A[r*n+c]);if(a>m){m=a;p=r}}
   if(!(m>1e-18))return false;
   if(p!==c){for(let k=c;k<n;k++){const t=A[c*n+k];A[c*n+k]=A[p*n+k];A[p*n+k]=t}const t=b[c];b[c]=b[p];b[p]=t}
   const d=A[c*n+c];
   for(let r=c+1;r<n;r++){const f=A[r*n+c]/d;if(f!==0){for(let k=c;k<n;k++)A[r*n+k]-=f*A[c*n+k];b[r]-=f*b[c]}}}
  for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r*n+k]*x[k];x[r]=s/A[r*n+r];if(!fin(x[r]))return false}
  return true}
}

/* ---- element models (each: n=nodes, st=stamp, ac=accept step, nl=non-linear, dyn=needs fine time step) ---- */
const EL={
 R(a,b,g){const gf=fn(g);return{n:[a,b],st(S){const g=gf();this.gg=g;S.gc(this.n[0],this.n[1],g)},ac(S){const v=S.v(this.n[0])-S.v(this.n[1]);this.v=v;this.i=v*this.gg;this.P=Math.abs(this.v*this.i);this.cu=[this.i,-this.i]}}},
 // Thevenin source driving node a relative to b: i(a->b)=g*(va-vb-Vth)
 TH(a,b,g,V){const gf=fn(g),vf=fn(V);return{n:[a,b],st(S){const g=gf(S.t),v=vf(S.t)*S.sc;this.gg=g;this.vt=v;S.gc(this.n[0],this.n[1],g);S.cf(this.n[0],this.n[1],-g*v)},ac(S){const v=S.v(this.n[0])-S.v(this.n[1]);this.v=v;this.i=this.gg*(v-this.vt);this.P=Math.abs(this.v*this.i);this.cu=[this.i,-this.i]}}},
 CS(a,b,I){const f=fn(I);return{n:[a,b],st(S){S.cf(this.n[0],this.n[1],f()*S.sc)},ac(S){this.v=S.v(this.n[0])-S.v(this.n[1]);this.i=f();this.cu=[this.i,-this.i]}}},
 // ideal voltage source (+ series Rs) with MNA branch current
 VS(a,b,V,Rs,o){const vf=fn(V);return Object.assign({n:[a,b],vs:1,Rs:Math.max(1e-3,Rs),st(S){S.vs(this.n[0],this.n[1],this.k,vf(S.t),this.Rs)},ac(S){const xk=S.x[S.N+this.k];this.d=-xk;this.i=xk;this.v=S.v(this.n[0])-S.v(this.n[1]);this.cu=[xk,-xk]}},o)},
 CAP(a,b,C,s){return{n:[a,b],dyn:1,st(S){const g=C/S.dt;this.gg=g;S.gc(this.n[0],this.n[1],g);S.cf(this.n[0],this.n[1],-g*(s.vc||0))},ac(S){const v=S.v(this.n[0])-S.v(this.n[1]);this.i=this.gg*(v-(s.vc||0));s.vc=v;this.v=v;this.P=0;this.cu=[this.i,-this.i]}}},
 IND(a,b,L,s){return{n:[a,b],dyn:1,st(S){const g=S.dt/L;this.gg=g;S.gc(this.n[0],this.n[1],g);S.cf(this.n[0],this.n[1],s.il||0)},ac(S){const v=S.v(this.n[0])-S.v(this.n[1]);s.il=this.gg*v+(s.il||0);this.i=s.il;this.v=v;this.P=0;this.cu=[this.i,-this.i]}}},
 // series R-L-emf (coil / motor winding)
 RL(a,b,R,L,emf,s,dynf){const ef=fn(emf);return{n:[a,b],dyn:dynf?1:0,st(S){const k=L/S.dt,d=R+k;this.gg=1/d;S.gc(this.n[0],this.n[1],1/d);S.cf(this.n[0],this.n[1],(-ef()+k*(s.il||0))/d)},ac(S){const v=S.v(this.n[0])-S.v(this.n[1]),k=L/S.dt,i=(v-ef()+k*(s.il||0))/(R+k);s.il=i;this.i=i;this.v=v;this.P=i*i*R;this.cu=[i,-i]}}},
 // p: {Is,nvt, vz,nz,Isz}  (diode / LED / Zener)
 DIO(a,k,p,s){const vc=p.nvt*Math.log(p.nvt/(Math.SQRT2*p.Is)),vcz=p.vz?p.nz*Math.log(p.nz/(Math.SQRT2*p.Isz)):0;
  return{n:[a,k],nl:1,st(S){let v=S.v(this.n[0])-S.v(this.n[1]);const vr=v,vo=s.vd||0;v=lim(v,vo,p.nvt,vc);
   if(p.vz){const u=lim(-v-p.vz,-vo-p.vz,p.nz,vcz);v=-u-p.vz}
   if(!(v<1e3&&v>-1e3))v=0;
   if(Math.abs(v-vr)>1e-6)S.nc=true;
   const e=ex(v/p.nvt);let i=p.Is*(e-1),g=p.Is/p.nvt*e+GMIN;
   if(p.vz){const eb=ex((-v-p.vz)/p.nz);i-=p.Isz*(eb-1);g+=p.Isz/p.nz*eb}
   s.vd=v;S.gc(this.n[0],this.n[1],g);S.cf(this.n[0],this.n[1],i-g*v)},
  ac(S){const v=S.v(this.n[0])-S.v(this.n[1]);let i=p.Is*(ex(v/p.nvt)-1);if(p.vz)i-=p.Isz*(ex((-v-p.vz)/p.nz)-1);this.v=v;this.i=i;this.P=Math.abs(v*i);s.vd=v;this.cu=[i,-i]}}},
 // BJT Ebers-Moll (pol=+1 NPN, -1 PNP); nodes [B,C,E]
 BJT(B,C,E,pol,p,s){const vc=VT*Math.log(VT/(Math.SQRT2*p.Is));
  const calc=(vbe,vbc)=>{const eb=ex(vbe/VT),ec=ex(vbc/VT),ife=p.Is*(eb-1),ifc=p.Is*(ec-1),gbe=p.Is/VT*eb,gbc=p.Is/VT*ec;
   return{ic:ife-ifc*(1+1/p.br),ib:ife/p.bf+ifc/p.br,dcE:gbe,dcC:-gbc*(1+1/p.br),dbE:gbe/p.bf,dbC:gbc/p.br}};
  return{n:[B,C,E],nl:1,st(S){const[b,c,e]=this.n;let vbe=pol*(S.v(b)-S.v(e)),vbc=pol*(S.v(b)-S.v(c));
   const r1=vbe,r2=vbc;vbe=lim(vbe,s.vbe||0,VT,vc);vbc=lim(vbc,s.vbc||0,VT,vc);if(Math.abs(vbe-r1)>1e-6||Math.abs(vbc-r2)>1e-6)S.nc=true;s.vbe=vbe;s.vbc=vbc;
   const q=calc(vbe,vbc);
   S.nl([b,c,e],[pol*q.ib,pol*q.ic,-pol*(q.ib+q.ic)],[[b,e],[b,c]],[pol*vbe,pol*vbc],[[q.dbE,q.dbC],[q.dcE,q.dcC],[-(q.dbE+q.dcE),-(q.dbC+q.dcC)]]);
   S.gc(b,e,GMIN);S.gc(b,c,GMIN)},
  ac(S){const[b,c,e]=this.n,vbe=pol*(S.v(b)-S.v(e)),vbc=pol*(S.v(b)-S.v(c)),q=calc(vbe,vbc);s.vbe=vbe;s.vbc=vbc;this.ic=pol*q.ic;this.ib=pol*q.ib;this.v=S.v(c)-S.v(e);this.i=this.ic;
   this.P=Math.abs(this.v*this.ic)+Math.abs(vbe*q.ib);this.cu=[this.ib,this.ic,-(this.ib+this.ic)]}}},
 // MOSFET level-1; nodes [G,D,S]
 MOS(G,D,Sn,pol,p){const F=(vgs,vds)=>{const vo=vgs-p.vth;if(vo<=0)return[0,0,0];const l=1+p.lam*vds;
   if(vds<vo)return[p.k*(vo*vds-vds*vds/2)*l,p.k*vds*l,p.k*(vo-vds)*l+p.k*(vo*vds-vds*vds/2)*p.lam];
   return[p.k/2*vo*vo*l,p.k*vo*l,p.k/2*vo*vo*p.lam]};
  const ev=(u1,u2)=>{const vgs=pol*u1,vds=pol*u2;let f,gm,gd;if(vds>=0){[f,gm,gd]=F(vgs,vds)}else{const r=F(vgs-vds,-vds);f=-r[0];gm=-r[1];gd=r[1]+r[2]}return[pol*f,gm,gd+1e-9]};
  return{n:[G,D,Sn],nl:1,st(S){const[g,d,s]=this.n,u1=S.v(g)-S.v(s),u2=S.v(d)-S.v(s),[f,gm,gd]=ev(u1,u2);
   S.nl([d,s],[f,-f],[[g,s],[d,s]],[u1,u2],[[gm,gd],[-gm,-gd]])},
  ac(S){const[g,d,s]=this.n,u1=S.v(g)-S.v(s),u2=S.v(d)-S.v(s),[f]=ev(u1,u2);this.i=f;this.v=u2;this.P=Math.abs(f*u2);this.cu=[0,f,-f]}}},
 // op-amp output stage: Vout = mid+half*tanh(A*vd/half), rails from V+/V- (previous step)
 OA(O,Ip,Im,s,Ro){return{n:[O,Ip,Im],nl:1,st(S){const[o,ip,im]=this.n,vd=S.v(ip)-S.v(im),hi=s.hi!=null?s.hi:12,lo=s.lo!=null?s.lo:0,half=Math.max(.05,(hi-lo)/2),mid=(hi+lo)/2,A=2e4,th=Math.tanh(Math.max(-30,Math.min(30,A*vd/half))),Vt=mid+half*th,dV=A*(1-th*th);
   const vo=S.v(o);S.nl([o],[(vo-Vt)/Ro],[[o,0],[ip,im]],[vo,vd],[[1/Ro,-dV/Ro]])},
  ac(S){const o=this.n[0];this.v=S.v(o);this.i=0;this.P=0;this.cu=[0,0,0]}}},
 DG(nodes,f){return{n:nodes.slice(),st(){},ac(S,dt){f(S,dt)}}},
 // symmetric varistor (MOV): i = sgn(v)*Ik*exp((|v|-Vn)/nz), Ik=1 mA at Vn, alpha~30

  return{n:[a,b],nl:1,st(S){let v=S.v(this.n[0])-S.v(this.n[1]);const vr=v,sg=v<0?-1:1,vo=s.vd||0;
   v=sg*(lim(Math.abs(v)-Vn,Math.abs(vo)-Vn,nz,vc)+Vn);
   if(!(Math.abs(v)<1e4))v=0;
   if(Math.abs(v-vr)>1e-6)S.nc=true;
   const e=ex((Math.abs(v)-Vn)/nz),i=sg*Ik*e,g=Ik/nz*e+GMIN;

};

/* ---- Simulation: netlist construction (Union-Find), stepping, failure model ---- */
class Sim{
 constructor(X){this.X=X;this.t=0;this.els=[];this.S=null;this.err=0;this.dirty=true;this.conv=true;this.watch=[];this.stat='nosrc';this.short=false;this.nodeOf=()=>-1;this.wf=new Float64Array(0)}
 build(comps,wires,TY){
  const X=this.X,id=new Map(),par=[];
  const gi=k=>{let v=id.get(k);if(v===undefined){v=par.length;id.set(k,v);par.push(v)}return v};
  const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a]}return a};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[a]=b};
  comps.forEach(c=>{c._r=c._r||{};TY[c.ty].pins.forEach((_,j)=>gi(c.id+'.'+j))});
  const gnd=par.length;par.push(gnd);
  wires.forEach(w=>{if(id.has(w.a)&&id.has(w.b))uni(id.get(w.a),id.get(w.b))});
  comps.forEach(c=>{const T=TY[c.ty];if(T.ties)T.ties.forEach(g=>{const f=id.get(c.id+'.'+g[0]);for(let i=1;i<g.length;i++)uni(f,id.get(c.id+'.'+g[i]))});if(c.ty=='gnd')uni(gnd,id.get(c.id+'.0'))});
  if(X.insert)X.insert(comps,(ka,kb)=>{if(id.has(ka)&&id.has(kb))uni(id.get(ka),id.get(kb))});
  const ctx0=(watch)=>({watch:(c,f,K,why)=>watch.push({c,f,K,why}),fail:X.fail,evt:X.evt,X});
  // pass 1: raw nodes, only to discover islands / reference nodes
  const run=(nd0,watch)=>{const els=[],ctx=ctx0(watch);
   comps.forEach(c=>{const T=TY[c.ty];if(!T.net)return;
    const nd=j=>nd0(id.get(c.id+'.'+j));
    const add=(e,pj)=>{e.c=c;if(pj)e.pk=pj.map(j=>c.id+'.'+j);els.push(e);return e};
    try{T.net(c,nd,add,ctx)}catch(er){X.err&&X.err('net '+c.ty+': '+er.message)}});
   return els};
  const els1=run(a=>find(a),[]);
  // islands: every floating group of elements gets a reference node
  const gr=find(gnd),q=par.map((_,i)=>i),f2=a=>{while(q[a]!==a){q[a]=q[q[a]];a=q[a]}return a};
  els1.forEach(e=>{for(let i=1;i<e.n.length;i++){const a=f2(e.n[0]),b=f2(e.n[i]);if(a!==b)q[a]=b}});
  const isl=new Map();
  els1.forEach(e=>e.n.forEach(n=>{const r=f2(n);let o=isl.get(r);if(!o){o={g:false,ref:null,any:n};isl.set(r,o)}if(n===gr)o.g=true}));
  els1.forEach(e=>{if(e.vs){const o=isl.get(f2(e.n[0]));if(o&&o.ref===null)o.ref=e.n[1]}});
  const gset=new Set([gr]);isl.forEach(o=>{if(!o.g)gset.add(o.ref!==null?o.ref:o.any)});
  const map=new Map();let N=0;const idx=raw=>{if(gset.has(raw))return 0;let v=map.get(raw);if(v===undefined){v=++N;map.set(raw,v)}return v};
  // pass 2: build the real elements with final matrix indices (closures see final indices too)
  const watch=[];const els=run(a=>idx(find(a)),watch);
  let K=0;const bad=[];
  els.forEach(e=>{if(e.vs){if(e.n[0]===e.n[1]){e.dead=1;bad.push(e)}else e.k=K++}});
  this.badSrc=bad.length>0;this.badIds=bad.map(e=>e.c&&e.c.id).filter(x=>x!=null);
  this.els=els.filter(e=>!e.dead);this.watch=watch;
  this.S=new Sys(N,K);this.hasNL=this.els.some(e=>e.nl);this.dyn=this.els.some(e=>e.dyn);
  this.cl=[...new Set(this.els.map(e=>e.c))];
  /* frozen node lookup: a pin that touches no element has no matrix row (never allocate one after the system was sized) */
  this.nodeOf=k=>{const i=id.get(k);if(i===undefined)return -1;const raw=find(i);if(gset.has(raw))return 0;const v=map.get(raw);return v===undefined?-1:v};
  /* islands: every matrix node and every wire knows its island, so each island gets its own display reference */
  const ik=new Map(),iOf=raw=>{const r=f2(raw);let k=ik.get(r);if(k===undefined){k=ik.size;ik.set(r,k)}return k};
  this.isl=new Int32Array(N);map.forEach((v,raw)=>{this.isl[v-1]=iOf(raw)});
  this.nIsl=ik.size;this.islOf=k=>{const i=id.get(k);return i===undefined?-1:(ik.has(f2(find(i)))?ik.get(f2(find(i))):-1)};
  this.st=null;this.ws=null;this.pkA=0;this.pkB=0;this.pkT=0;this.shA=0;this.shB=0;
  // wire-current spanning forest (for animated current flow along wires)
  const pidx=new Map(),adj=[];const pi=k=>{let v=pidx.get(k);if(v===undefined){v=adj.length;pidx.set(k,v);adj.push([])}return v};

 /* part name: centred when it fits, otherwise rotated along a tall box, otherwise above/below it */

/* ---- digital IC framework: supply/threshold handling + Thevenin outputs ---- */
function digNet(c,nd,add,X,sp){
 const s=c._r,gN=nd(sp.gnd),vN=nd(sp.vcc);s.o=s.o||{};s.h=s.h||{};s.pv=s.pv||{};s.vdd=s.vdd||0;
 const lvV=lv=>lv===1?s.vdd:lv&&lv.v!=null?lv.v:0;
 for(const j in sp.out){const o=sp.out[j],jj=+j,od=o.mode=='od',vref=o.vcc!=null?o.vcc:null;
  const e=add(EL.TH(nd(jj),gN,()=>{const lv=s.o[jj];if(!s.on||lv==null||lv==='z')return Eng.GMIN;if(od&&lv!==0)return Eng.GMIN;return 1/(o.ro||50)},()=>{const lv=s.o[jj];return od?0:lvV(lv)}),[jj]);e.src=1;e.pw=1}
 const nodes=[];(sp.in||[]).forEach(j=>nodes.push(nd(j)));nodes.push(gN,vN);
 if(sp.rl)add(EL.R(vN,gN,1/sp.rl));
 add(EL.DG(nodes,(S,dt)=>{const vg=S.v(gN);s.vdd=S.v(vN)-vg;s.on=s.vdd>(sp.vmin||2.5);
  const I={v:{},h:s.h,e:{}};
  (sp.in||[]).forEach((j,i)=>{const v=S.v(nodes[i])-vg;I.v[j]=v;const p=s.h[j];const h=v>.6*s.vdd?1:v<.4*s.vdd?0:(p||0);I.e[j]=!p&&h?1:0;s.h[j]=h});
  if(sp.pre)sp.pre(s,S,vg);
  if(s.on){sp.run(s,I,S.t,dt)}else{s.o={}}}));
}

/* ---- breadboard: parts whose pins sit on a hole are connected to that strip ---- */
function insertBB(comps,link){
 const bbs=comps.filter(c=>TY[c.ty].bb);if(!bbs.length)return;
 const cell=new Map(),K=(x,y)=>Math.floor(x/8)+','+Math.floor(y/8);
 bbs.forEach(b=>TY[b.ty].pins.forEach((_,j)=>{const p=tp(b,j),k=K(p.x,p.y);let a=cell.get(k);if(!a)cell.set(k,a=[]);a.push([b.id+'.'+j,p.x,p.y])}));
 comps.forEach(c=>{if(TY[c.ty].bb)return;TY[c.ty].pins.forEach((_,j)=>{const p=tp(c,j),cx=Math.floor(p.x/8),cy=Math.floor(p.y/8);let best=null,bd=7;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const l=cell.get((cx+a)+','+(cy+b));if(l)for(const h of l){const d=Math.hypot(h[1]-p.x,h[2]-p.y);if(d<bd){bd=d;best=h[0]}}}
  if(best)link(c.id+'.'+j,best)})})}

function meterTxt(r,k,u,cpl){const m=r[k=='v'?'vm':'im'],q=r[k=='v'?'vq':'iq'];if(m==null||!Number.isFinite(m))return si(0,u);
 const a=Math.sqrt(Math.max(0,q-m*m)),z=x=>Math.abs(x)<1e-9?0:x;
 if(cpl===1)return si(z(m),u);if(cpl===2)return'~'+si(a<1e-9?0:a,u);
 return a>1e-6&&a>Math.abs(m)?'~'+si(a,u):si(z(m),u)}
function mmTxt(c,r){const m=+P(c,'mode');
 if(m===2){if(r.ov==null)return'—';const v=r.ov<0&&r.ov>-1e-6?0:r.ov,R=v>=1?Infinity:+(v/(1-v)*1e4).toPrecision(5);return!(R>=0)||R>40e6?'OL':si(R,'Ω')}
 if(m===7){if(r.ov==null)return'—';return r.ov>2.8||r.ov<-1e-3?'OL':si(Math.max(0,r.ov),'V')}
 const cur=m===1||m===5||m===6;return meterTxt(r,cur?'i':'v',cur?'A':'V',m===3||m===5?1:m===4||m===6?2:0)}

   if(a==='close')this.close();else if(a==='cat'){this.cat=b.dataset.k;this.page=0;this.view='browse';this.render();this.load()}
   else if(a==='sort'){this.sort=b.dataset.k;this.page=0;this.load()}else if(a==='item')this.show(b.dataset.id);else if(a==='back'){this.view='browse';this.render();this.paintList()}
   else if(a==='install')this.install(b.dataset.id);else if(a==='remove')this.remove(b.dataset.id);else if(a==='rate')this.rate(+b.dataset.s);
   else if(a==='mine'){this.view='mine';this.render();this.loadMine()}else if(a==='publish'){this.view='publish';this.render()}else if(a==='more'){this.page++;this.load(true)}
   else if(a==='creator')this.creator(b.dataset.uid);else if(a==='signin'){this.close();Login.open()}else if(a==='del')this.unpublish(b.dataset.id)});
  e.addEventListener('input',ev=>{if(ev.target.id==='mkQ'){clearTimeout(this._q);this._q=setTimeout(()=>{this.q=ev.target.value;this.page=0;if(this.view!=='browse'){this.view='browse';this.render()}this.load()},320)}});

 stars(v,big){let h='';for(let i=1;i<=5;i++)h+='<i class="'+(v>=i-.25?'on':v>=i-.75?'half':'')+'">★</i>';return'<span class="mk-st'+(big?' big':'')+'">'+h+'</span>'},

 async install(id){if(this.busy)return;this.busy=true;const b=this.el.querySelector('[data-a=install][data-id="'+id+'"]');if(b){b.disabled=true;b.classList.add('ld')}

   if(ok){const m=this.inst();m[x.id]={name:x.name,ver:x.ver,kind:x.kind,t:Date.now(),parts:ok.parts||[],bots:ok.bots||[]};this.setInst(m);flashOk(t('mk_done',{name:x.name}))}
   if(this.view==='item'){this.item=Object.assign(this.item||{},x,{creator:(this.item||{}).creator||x.creator});this.paintItem()}else this.paintList()}
  catch(e){Toast.show(t('mk_fail')+' '+e.message,true,{key:'mk'})}finally{this.busy=false}},
 async apply(x,p){if(!p||typeof p!=='object')throw new Error('empty');const res={parts:[],bots:[]};
  const addDef=def=>{if(!Entitlement.can('partbuilder')){Paywall.open('partbuilder');throw new Error(t('ai_x_locked',{part:t('pb_title')}))}
   const d=cleanPart(Object.assign({},def,{id:'cu_x'+AIT.h32(x.id+'|'+(def.name||''))}));if(!d||!d.pins.length)return;const i=CULIB.findIndex(c=>c.id===d.id);if(i>=0)CULIB[i]=d;else CULIB.push(d);registerCustom(d);res.parts.push(d.id)};
  const addBot=bt=>{if(!bt||!bt.prompt)return;const l=Bots.list(),id='b'+AIT.h32(x.id+'|'+(bt.name||''));const o={id,name:String(bt.name||x.name).slice(0,40),prompt:String(bt.prompt).slice(0,8000),chips:(Array.isArray(bt.chips)?bt.chips:[]).slice(0,6).map(s=>String(s).slice(0,120)),ext:x.id};
   const i=l.findIndex(b=>b.id===id);if(i>=0)l[i]=o;else l.push(o);Bots.save(l);res.bots.push(id)};
  if(x.kind==='part'||x.kind==='pack'){(p.parts||(p.def?[p.def]:p.pins?[p]:[])).forEach(addDef);if(res.parts.length){pbSaveLib();buildPalette()}}
  if(x.kind==='bot'||x.kind==='pack'){(p.bots||(p.prompt?[p]:[])).forEach(addBot);if(res.bots.length&&x.kind==='bot'){Bots.use(res.bots[0])}}
  if(x.kind==='circuit'||(x.kind==='pack'&&p.doc)){if(!p.doc)throw new Error('no circuit');const ok=await Proj.guard();if(!ok)return null;this.close();
   Veil.run(()=>{loadDoc(cleanDoc(p.doc));Proj.name=String(x.name).slice(0,80);Proj.path=null;Proj.handle=null;Proj.cid=Proj.newCid();Proj.markSaved(true);fitView()})}
  if(x.kind==='sketch'||(x.kind==='pack'&&p.code)){const code=String(p.code||'');if(!code)throw new Error('no code');if(!Entitlement.can('arduino')){Paywall.open('arduino');return null}
   let c=App.comps.find(k=>TY[k.ty].ard);if(!c){c=addPart(p.board&&TY[p.board]&&TY[p.board].ard?p.board:'uno',null);if(!c)return null}
   c.code=code;delete c._noauto;Run.dirty=true;try{Run.rebuild();Run.upload(c)}catch(e){}Hist.commit();this.close();openDock('code')}
  return res},
 remove(id){const m=this.inst(),r=m[id];if(!r)return;(r.parts||[]).forEach(pid=>{const i=CULIB.findIndex(c=>c.id===pid);if(i>=0&&!App.comps.some(c=>c.ty===pid))CULIB.splice(i,1)});pbSaveLib();buildPalette();
  if(r.bots&&r.bots.length){Bots.save(Bots.list().filter(b=>!r.bots.includes(b.id)));if(r.bots.includes(Store.get('zf_bot')))Bots.use('')}
  delete m[id];this.setInst(m);flashOk(t('mk_removed'));if(this.view==='item')this.paintItem();else this.paintList()},
 async rate(s){if(!Auth.u)return;try{const r=await this.api('POST','/api/ext/'+encodeURIComponent(this.item.id)+'/rate',{stars:s},true);const my=Store.json('zf_ext_rate')||{};my[this.item.id]=s;Store.set('zf_ext_rate',JSON.stringify(my));
  this.item=Object.assign(this.item,r.item,{creator:this.item.creator});this.paintItem();flashOk(t('mk_thanks'))}catch(e){Toast.show(e.message,true,{key:'mk'})}},
 /* ---- my extensions + publishing ---- */

 paintPublish(){const m=$('#mkMain');if(!Auth.u){m.innerHTML=this.needSign();return}
  const cats=MK_CATS.slice(1).map(([k,l])=>'<option value="'+k+'">'+esc(t(l))+'</option>').join('');
  const srcs=[['circuit','mk_src_circuit'],['part','mk_src_part'],['sketch','mk_src_sketch'],['bot','mk_src_bot'],['file','mk_src_file']].map(([k,l])=>'<option value="'+k+'">'+esc(t(l))+'</option>').join('');

   +'<label>'+esc(t('mk_f_desc'))+'<textarea name="desc" rows="4" maxlength="2000" required></textarea></label>'

 paintSrc(f){const s=f.src.value,box=f.querySelector('.mk-src');
  if(s==='part')box.innerHTML='<label>'+esc(t('mk_src_part'))+'<select name="pid">'+(CULIB.length?CULIB.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>').join(''):'<option value="">—</option>')+'</select></label>';
  else if(s==='bot')box.innerHTML='<label>'+esc(t('mk_bot_prompt'))+'<textarea name="prompt" rows="6" maxlength="8000" placeholder="'+esc(t('mk_bot_ph'))+'"></textarea></label><label>'+esc(t('mk_bot_chips'))+'<input name="chips" placeholder="'+esc(t('mk_bot_chips_ph'))+'"></label>';
  else if(s==='file')box.innerHTML='<label>'+esc(t('mk_src_file'))+'<input name="file" type="file" accept=".json,.voltra,.zingo,application/json"></label>';
  else box.innerHTML='<p class="mk-hint">'+esc(t(s==='circuit'?'mk_src_circuit_d':'mk_src_sketch_d'))+'</p>'},
 async publish(f){const err=m=>{f.querySelector('.mk-err').textContent=m||''};err('');const s=f.src.value;let kind=s,payload=null;
  const readF=(inp,asUrl)=>new Promise((ok,bad)=>{const fl=inp&&inp.files&&inp.files[0];if(!fl)return ok(null);if(fl.size>MK_MAX)return bad(new Error(t('mk_big')));const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>bad(new Error('read'));asUrl?r.readAsDataURL(fl):r.readAsText(fl)});
  try{
   if(s==='circuit'){if(!App.comps.length)throw new Error(t('mk_e_empty'));payload={doc:serialize(App)}}
   else if(s==='part'){const d=CULIB.find(c=>c.id===f.pid.value);if(!d)throw new Error(t('mk_e_nopart'));payload={def:d}}
   else if(s==='sketch'){const c=App.comps.find(k=>TY[k.ty].ard&&k.code);if(!c)throw new Error(t('mk_e_nocode'));payload={code:c.code,board:c.ty}}
   else if(s==='bot'){const pr=f.prompt.value.trim();if(pr.length<20)throw new Error(t('mk_e_prompt'));payload={name:f.name.value.trim(),prompt:pr,chips:f.chips.value.split('|').map(x=>x.trim()).filter(Boolean)}}
   else{const tx=await readF(f.file);if(!tx)throw new Error(t('mk_e_file'));const j=JSON.parse(tx);
    if(j&&j.format==='zingo-project'&&j.doc){kind='circuit';payload={doc:j.doc}}else if(j&&j.pins&&j.shapes){kind='part';payload={def:j}}else{kind='pack';payload=j}}
   if(JSON.stringify(payload).length>MK_MAX)throw new Error(t('mk_big'));
   let icon='';const iu=await readF(f.icon,true);if(iu){icon=await new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const k=Math.max(128/im.width,128/im.height);x.drawImage(im,(128-im.width*k)/2,(128-im.height*k)/2,im.width*k,im.height*k);ok(c.toDataURL('image/png'))};im.onerror=()=>ok('');im.src=iu})}
   const btn=f.querySelector('[type=submit]');btn.disabled=true;
   try{const r=await this.api('POST','/api/ext',{name:f.name.value,desc:f.desc.value,cat:f.cat.value,kind,ver:f.ver.value,icon,payload},true);if(!r.ok)throw new Error(r.error||'error');flashOk(t('mk_pub_ok'));this.view='item';this.show(r.item.id)}
   finally{btn.disabled=false}}
  catch(e){err(e.message)}}};

const PFX={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9};

const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];

const SKETCHES=[
{n:'sk_blink',code:`// Blink: toggles the on-board LED (pin 13) every half second
void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(500);
  digitalWrite(LED_BUILTIN, LOW);

{n:'sk_fade',code:`// Fade: smoothly changes the brightness of an LED on PWM pin 9
const int LED = 9;
int brightness = 0;
int fadeAmount = 5;

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  analogWrite(LED, brightness);
  brightness = brightness + fadeAmount;
  if (brightness <= 0 || brightness >= 255) {
    fadeAmount = -fadeAmount;
  }
  delay(20);
}
`},
{n:'sk_pot',code:`// Potentiometer: read A0 (10-bit), print it and light the on-board LED above half scale
void setup() {
  Serial.begin(9600);
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  int value = analogRead(A0);
  float volts = value * 5.0 / 1023.0;
  Serial.print("A0 = ");
  Serial.print(value);
  Serial.print("  (");
  Serial.print(volts);
  Serial.println(" V)");
  if (value > 512) {
    digitalWrite(LED_BUILTIN, HIGH);
  } else {
    digitalWrite(LED_BUILTIN, LOW);
  }
  delay(250);
}
`},

#include <Servo.h>

Servo myServo;

  myServo.attach(9);

void loop() {
  for (pos = 0; pos <= 180; pos += 2) {

{n:'sk_game',code:"// Volt Runner: an original runner game for a 128x64 OLED.\n// Push button on D2 (to GND) = jump. Buzzer on D8.\n// Run the circuit, then tap the OLED to play it full size (Space / arrow up also jumps).\n#include <Wire.h>\n#include <Adafruit_SSD1306.h>\nAdafruit_SSD1306 display(128, 64, &Wire, -1);\n\nconst int BTN = 2;\nconst int BUZ = 8;\nint py = 48;\nfloat vy = 0;\nint ox[3];\nint oh[3];\nint speed = 2;\nlong score = 0;\nlong best = 0;\nbool over = false;\nint frame = 0;\n\nvoid resetGame() {\n  for (int i = 0; i < 3; i++) {\n    ox[i] = 140 + i * 55 + random(0, 30);\n    oh[i] = random(6, 14);\n  }\n  py = 48; vy = 0; speed = 2; score = 0; over = false;\n}\n\nvoid setup() {\n  pinMode(BTN, INPUT_PULLUP);\n  pinMode(BUZ, OUTPUT);\n  display.begin(SSD1306_SWITCHCAPVCC, 0x3C);\n  randomSeed(analogRead(A0));\n  resetGame();\n}\n\nvoid drawRunner(int x, int y) {\n  display.fillRect(x + 1, y, 6, 6, WHITE);\n  display.drawPixel(x + 5, y + 2, BLACK);\n  display.drawLine(x + 4, y - 3, x + 3, y - 1, WHITE);\n  if ((frame / 4) % 2 == 0 || y < 48) {\n    display.drawFastHLine(x, y + 7, 3, WHITE);\n    display.drawFastHLine(x + 5, y + 7, 3, WHITE);\n  } else {\n    display.drawFastHLine(x + 2, y + 7, 4, WHITE);\n  }\n}\n\nvoid drawSpark(int x, int h) {\n  display.fillTriangle(x, 56, x + 4, 56 - h, x + 8, 56, WHITE);\n  display.drawPixel(x + 4, 54 - h, WHITE);\n}\n\nint farthest() {\n  int m = 0;\n  for (int i = 0; i < 3; i++) if (ox[i] > m) m = ox[i];\n  return m;\n}\n\nvoid loop() {\n  bool pressed = digitalRead(BTN) == LOW;\n  if (over) {\n    if (pressed) { resetGame(); delay(250); }\n    delay(30);\n    return;\n  }\n  if (pressed && py >= 48) { vy = -6.5; tone(BUZ, 880, 40); }\n  vy += 0.6;\n  py += (int)vy;\n  if (py > 48) { py = 48; vy = 0; }\n\n  display.clearDisplay();\n  display.drawFastHLine(0, 56, 128, WHITE);\n  for (int x = 0; x < 128; x += 8) display.drawPixel((x - (frame * speed) % 8 + 128) % 128, 60, WHITE);\n  for (int i = 0; i < 3; i++) {\n    ox[i] -= speed;\n    if (ox[i] < -10) {\n      ox[i] = max(farthest(), 128) + random(40, 90);\n      oh[i] = random(6, 14);\n      score += 10;\n      if (score % 100 == 0) tone(BUZ, 1320, 60);\n    }\n    drawSpark(ox[i], oh[i]);\n    if (ox[i] < 23 && ox[i] + 8 > 17 && py + 8 > 58 - oh[i]) {\n      over = true;\n      if (score > best) best = score;\n      tone(BUZ, 120, 400);\n    }\n  }\n  drawRunner(16, py);\n  speed = 2 + score / 150;\n  if (speed > 6) speed = 6;\n\n  display.setCursor(0, 0);\n  display.print(\"SCORE \");\n  display.print(score);\n  display.print(\"  BEST \");\n  display.print(best);\n  if (over) {\n    display.fillRect(20, 22, 88, 26, BLACK);\n    display.drawRect(20, 22, 88, 26, WHITE);\n    display.setCursor(36, 24);\n    display.print(\"GAME OVER\");\n    display.setCursor(30, 32);\n    display.print(\"press button\");\n  }\n  display.display();\n  frame++;\n  delay(30);\n}\n"},

const int TRIG = 9;

void setup() {
  Serial.begin(9600);
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);

  if (cm < 20) {
    digitalWrite(LED_BUILTIN, HIGH);
  } else {
    digitalWrite(LED_BUILTIN, LOW);
  }
  delay(300);
}

 const d={v:3,uid:1,comps:[],wires:[],probes:[]},ids={};
 ex.parts.forEach(p=>{const[k,ty,props,r,pin,cx,cy,f]=p,id=d.uid++;ids[k]=id;
  const c=Object.assign({id,ty,x:0,y:0,r:r||0},props||{});if(f)c.f=1;

 const T=def(d.id,'cu',d.w,d.h,pins,{d:dd,props,custom:1,rev:d.rev,ties:pbTies(d),net:pbNet(d),draw:c=>drawDef(d,c),sch:c=>d.symbol==='draw'?drawDef(d,c):genericSch(c)});
 if(d.fx.length)T.anim=pbAnim(d);
 T.scal=1;T.d=Object.assign({bs:1,lg:0},T.d);T.props=T.props.concat([RNG('bs','p_size',.3,2.5,.05,'×'),RNG('lg','p_leg',0,80,10,'')]);
 delete INTER[d.id];
 if(d.inter.m==='toggle'&&d.inter.k){const k=d.inter.k;INTER[d.id]={click:c=>{c[k]=c[k]?0:1;Aud.click()}}}
 else if(d.inter.m==='hold')INTER[d.id]={down:c=>{c.p=1;Aud.click()},up:c=>{c.p=0}};
 Pal.thumbs.delete(d.id);return T}

function pbSaveLib(){Store.set(PB_KEY,JSON.stringify(CULIB))}
function pbLoadLib(){const a=Store.json(PB_KEY);CULIB=[];if(Array.isArray(a))a.forEach(x=>{const d=cleanPart(x);if(d&&!CULIB.some(y=>y.id===d.id)){CULIB.push(d);registerCustom(d)}})}
function customParts(app){const ids=new Set();app.comps.forEach(c=>{if(TY[c.ty]&&TY[c.ty].custom)ids.add(c.ty)});return[...ids].map(id=>CU[id]).filter(Boolean)}
function registerDocParts(list){
 if(!Array.isArray(list))return;
 list.slice(0,40).forEach(x=>{const d=cleanPart(x);if(!d)return;const cur=CU[d.id];
  if(cur&&cur.rev>=d.rev)return;
  registerCustom(d);const i=CULIB.findIndex(y=>y.id===d.id);if(i>=0)CULIB[i]=d;else CULIB.push(d);pbSaveLib()})}

function pbBox(s){return s.k==='line'?[Math.min(s.x,s.x2),Math.min(s.y,s.y2),Math.abs(s.x2-s.x),Math.abs(s.y2-s.y)]:s.k==='text'?[s.x-s.tx.length*s.fs*.3,s.y-s.fs,s.tx.length*s.fs*.6,s.fs*1.35]:[s.x,s.y,s.w,s.h]}

  if(b.t==='logic'){b.in=b.in.filter(v=>v!==i).map(v=>v>i?v-1:v);b.out=b.out.filter(v=>v!==i).map(v=>v>i?v-1:v);b.vcc=m(b.vcc);b.gnd=m(b.gnd);pbFixTT(b)}});

function pbPt(e){const r=PB.svg.getBoundingClientRect();return[(e.clientX-r.left)/PB.zs,(e.clientY-r.top)/PB.zs]}
function pbDown(e){
 if(e.button!==0)return;const[x,y]=pbPt(e),tool=PB.tool,d=PB.d;
  /* drag tracking */
 let L={m:null};const mvw=e2=>L.m&&L.m(e2),upw=()=>{window.removeEventListener('pointermove',mvw);window.removeEventListener('pointerup',upw);L.m=null;pbDraw();pbSide()};

  const hdl=e.target.closest('[data-h]');
  if(hdl&&PB.sel&&PB.sel.t==='s'){const s=d.shapes[PB.sel.i],n=hdl.getAttribute('data-h');
   track(e2=>{const[px,py]=pbPt(e2),sx=pbSn(px,5),sy=pbSn(py,5);

  const pn=e.target.closest('[data-pin]');

  const sh=e.target.closest('[data-i]');
  if(sh){const i=+sh.getAttribute('data-i'),s=d.shapes[i];PB.sel={t:'s',i};pbDraw();pbSide();
   const o=pbClone(s),[ox,oy]=[x,y];
   track(e2=>{const[px,py]=pbPt(e2),dx=pbSn(px-ox,5),dy=pbSn(py-oy,5);s.x=o.x+dx;s.y=o.y+dy;if(s.k==='line'){s.x2=o.x2+dx;s.y2=o.y2+dy}PB.dirty=true;pbDraw()});return}
  PB.sel=null;pbDraw();pbSide();return}
 /* drawing tools */
 const sx=pbSn(x,5),sy=pbSn(y,5),s=pbNewShape(tool,sx,sy);d.shapes.push(s);const idx=d.shapes.length-1;PB.sel={t:'s',i:idx};PB.dirty=true;

 track(e2=>{const[px,py]=pbPt(e2),ex=pbSn(px,5),ey=pbSn(py,5);
  if(tool==='line'){s.x2=ex;s.y2=ey}else{s.x=Math.min(sx,ex);s.y=Math.min(sy,ey);s.w=Math.max(5,Math.abs(ex-sx));s.h=Math.max(5,Math.abs(ey-sy))}pbDraw()});

  const k=[tools];

const KEY_PROJ='zf_proj';
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+'.'+s.length};
const safeName=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'Voltra';

function flashOk(m){const e=$('#stSave');if(!e)return;e.textContent='✓ '+m;e.classList.add('on');clearTimeout(_svT);_svT=setTimeout(()=>e.classList.remove('on'),2600)}
const Proj={name:'',path:null,handle:null,saved:'',cid:'',
 init(){const p=Store.json(KEY_PROJ)||{};this.name=typeof p.name==='string'?p.name:'';this.path=DESK&&typeof p.path==='string'?p.path:null;this.saved=typeof p.saved==='string'?p.saved:'';
  this.cid=typeof p.cid==='string'&&p.cid?p.cid:this.newCid();this.paint()},
 /* conversation id: a saved file keeps its chat (derived from the path); a new or imported project starts a new chat */
 newCid(){return'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
 pathCid(move){if(!this.path)return;const c='f'+hashStr(this.path);if(c===this.cid)return;if(move)try{AIChats.move(this.cid,c)}catch(e){}this.cid=c},
 title(){return this.name||t('pj_untitled')},
 cur(){return Hist.cur||JSON.stringify(serialize(App))},
 dirty(){return hashStr(this.cur())!==this.saved&&(App.comps.length>0||!!this.path||!!this.handle)},
 remember(){Store.set(KEY_PROJ,JSON.stringify({name:this.name,path:this.path,saved:this.saved,cid:this.cid}))},
 paint(){const d=this.dirty(),n=$('#pjName'),dot=$('#pjDot'),b=$('#pj');if(n)n.textContent=this.title();if(dot)dot.hidden=!d;
  if(b)b.title=(this.path?this.path:this.title())+(d?' •':'');
  document.title=(d?'• ':'')+this.title()+' — Voltra';if(DESK)try{DESK.setTitle(this.title(),d,this.path||'')}catch(e){}
  try{AI.setProject(this.cid)}catch(e){}},
 text(){return JSON.stringify({format:'zingo-project',version:1,app:'Voltra',name:this.title(),savedAt:new Date().toISOString(),doc:serialize(App)},null,1)},
 /* accepts a .voltra / .zingo project or a bare circuit JSON from older versions */
 parse(text){const j=JSON.parse(text);if(j&&j.format==='zingo-project'&&j.doc)return{name:typeof j.name==='string'?j.name:'',doc:cleanDoc(j.doc)};return{name:'',doc:cleanDoc(j)}},
 markSaved(quiet){this.saved=hashStr(this.cur());this.remember();this.paint();if(!quiet)flashOk(t('pj_saved',{name:this.title()}))},
 async write(){const txt=this.text();
  if(DESK&&this.path){const r=await DESK.writeProject(this.path,txt).catch(()=>null);return!!(r&&r.ok)}
  if(this.handle){try{const w=await this.handle.createWritable();await w.write(txt);await w.close();return true}catch(e){return false}}
  return false},
 async save(){if(!this.path&&!this.handle)return this.saveAs();
  if(await this.write()){this.markSaved();this.recent();return true}
  Toast.show(t('pj_save_fail'),true,{key:'pjsave'});return false},
 async saveAs(){const sug=safeName(this.title())+'.voltra';
  if(DESK){const r=await DESK.pickSavePath(sug).catch(()=>null);if(!r||!r.path)return false;const old=[this.path,this.name];this.path=r.path;this.name=r.name||this.name;
   if(await this.write()){this.pathCid(true);this.markSaved();this.recent();return true}[this.path,this.name]=old;Toast.show(t('pj_save_fail'),true,{key:'pjsave'});return false}
  if(window.showSaveFilePicker){let h;try{h=await window.showSaveFilePicker({suggestedName:sug,types:[{description:'Voltra',accept:{'application/json':['.voltra']}}]})}catch(e){if(e&&e.name==='AbortError')return false;h=null}
   if(h){const old=[this.handle,this.name];this.handle=h;this.name=String(h.name||sug).replace(/\.(voltra|zingo|json)$/i,'');if(await this.write()){this.markSaved();return true}[this.handle,this.name]=old;Toast.show(t('pj_save_fail'),true,{key:'pjsave'});return false}}
  if(downloadBlob(sug,new Blob([this.text()],{type:'application/json'}))){this.markSaved();return true}return false},
 /* before replacing the open project: Save / Don't save / Cancel */
 async guard(){if(!this.dirty())return true;
  const v=await Modal.open({title:t('pj_unsaved_t'),body:'<p>'+esc(t('pj_unsaved_q',{name:this.title()}))+'</p>',buttons:[{l:t('cancel'),v:null},{l:t('pj_dont'),v:'no',dng:1},{l:t('pj_save'),v:'save',pri:1}]});
  if(v==='no')return true;if(v==='save')return await this.save();return false},
 load(text,o){o=o||{};let p;try{p=this.parse(text)}catch(e){Toast.show(t('pj_open_fail'),true,{key:'pjopen'});return false}
  loadDoc(p.doc);this.name=String(p.name||o.name||'').slice(0,80);this.path=o.path||null;this.handle=o.handle||null;this.cid=this.newCid();this.pathCid();this.markSaved(true);this.recent();return true},
 async open(){if(!await this.guard())return;
  if(DESK){const r=await DESK.openProject().catch(()=>null);if(r&&r.text!=null)this.load(r.text,{path:r.path,name:r.name});return}
  if(window.showOpenFilePicker){try{const[h]=await window.showOpenFilePicker({types:[{description:'Voltra',accept:{'application/json':['.voltra','.zingo','.json']}}]});const f=await h.getFile();this.load(await f.text(),{handle:h,name:f.name.replace(/\.(voltra|zingo|json)$/i,'')});return}catch(e){if(e&&e.name==='AbortError')return}}
  pickFile()},
 async openPath(path){if(!DESK)return;if(path!==this.path&&!await this.guard())return;const r=await DESK.readProject(path).catch(()=>null);
  if(!r||r.text==null){Toast.show(t('pj_missing'),true,{key:'pjopen'});this.recent();return}this.load(r.text,{path:r.path,name:r.name})},
 async newProject(){if(!await this.guard())return;
  const nm=await Modal.prompt(t('pj_new_t'),t('pj_name'),'');if(nm===null||nm===undefined)return;const name=String(nm).trim().slice(0,80);
  loadDoc(EMPTY_DOC());this.name=name;this.path=null;this.handle=null;this.cid=this.newCid();this.markSaved(true);
  /* desktop: the project file is created right away under Documents/Voltra/<name>.voltra */
  if(DESK){const r=await DESK.createProject(safeName(name||t('pj_untitled'))).catch(()=>null);if(r&&r.path){this.path=r.path;this.pathCid(true);if(await this.write()){this.markSaved(true);this.recent();flashOk(t('pj_created',{name:this.title()}))}}}
  this.paint()},
 async rename(){const nm=await Modal.prompt(t('pj_rename'),t('pj_name'),this.name);if(nm===null||nm===undefined)return;const name=String(nm).trim().slice(0,80);if(name===this.name)return;
  if(DESK&&this.path){const r=await DESK.renameProject(this.path,safeName(name||t('pj_untitled'))).catch(()=>null);if(r&&r.path){this.path=r.path;this.pathCid(true)}}
  this.name=name;if(this.path||this.handle){if(await this.write())this.markSaved(true)}this.remember();this.paint();this.recent()},
 list:[],
 recent(){if(!DESK)return;DESK.recent().then(l=>{this.list=Array.isArray(l)?l.slice(0,8):[];if(!App.comps.length)paintRecent()}).catch(()=>{})}};

function saveFile(name,blob,kind){
 /* exports are named after the project (my-project.png, my-project-parts.csv ...) */
 name=name.replace(/^zingo-circuit/,safeName(Proj.title())).replace(/^zingo-parts-list/,safeName(Proj.title())+'-parts');
 if(DESK)return blob.arrayBuffer().then(b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return DESK.exportFile(name,btoa(s))}).then(r=>{if(r&&r.path)flashOk(t('pj_saved',{name:r.name||name}))}).catch(()=>Toast.show(t('pj_save_fail'),true,{key:'pjsave'}));
 if(downloadBlob(name,blob))return Promise.resolve();
 return fallbackSave(name,blob,kind)}
function fallbackSave(name,blob,kind){
 return new Promise(res=>{const done=()=>res();
  if(kind==='text'){blob.text().then(txt=>{const ta=mk('textarea','ta');ta.readOnly=true;ta.value=txt;Modal.open({title:name,body:ta,buttons:[{l:t('close'),v:1,pri:1}]}).then(done);setTimeout(()=>{ta.focus();ta.select()},40)})}
  else{const r=new FileReader();r.onload=()=>{const img=mk('img');img.src=r.result;img.style.cssText='max-width:100%;border-radius:8px';Modal.open({title:name,body:img,buttons:[{l:t('close'),v:1,pri:1}]}).then(done)};r.readAsDataURL(blob)}})}

function buildSVG(){
 if(!App.comps.length)return null;
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;App.comps.forEach(c=>{const b=bboxOf(c);x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1)});
 try{const lb=$('#gL').getBBox();if(lb.width>0){x0=Math.min(x0,lb.x);y0=Math.min(y0,lb.y);x1=Math.max(x1,lb.x+lb.width);y1=Math.max(y1,lb.y+lb.height)}}catch(e){}
 const m=36;x0-=m;y0-=m+10;x1+=m;y1+=m;const w=Math.ceil(x1-x0),h=Math.ceil(y1-y0);
 const cs=getComputedStyle(document.documentElement),V=k=>cs.getPropertyValue('--'+k).trim();
 const ser=new XMLSerializer(),part=n=>{const c=n.cloneNode(true);$$('.sel',c).forEach(e=>e.classList.remove('sel'));c.removeAttribute('id');return ser.serializeToString(c)};
 let body=['gBB','gC','gL','gW','gP'].map(id=>part($('#'+id))).join('')+part(gJ);
 let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="'+x0+' '+y0+' '+w+' '+h+'"><defs>'+$('#gdefs defs').innerHTML+'</defs><style>'+EXPORT_CSS+'</style><rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="var(--bg2)"/>'+body+'</svg>';
 s=s.replace(/var\(--([a-z0-9]+)\)/g,(_,k)=>V(k)||'#888');
 if(!Entitlement.can('export')){const fs=Math.max(12,Math.round(w/40));s=s.replace(/<\/svg>$/,'<text x="'+(x1-14)+'" y="'+(y1-12)+'" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="'+fs+'" font-weight="700" fill="#8a94a3" fill-opacity=".8">Voltra - Free</text></svg>')}
 return{svg:s,w,h}}
function exportBOM(){
 const m=new Map();
 App.comps.forEach(c=>{const T=TY[c.ty];if(!T||c.ty==='jn'||c.ty==='bb')return;
  let v='';try{if(T.d&&T.d.v!=null&&T.u)v=fmtU(P(c,'v'),T.u)}catch(e){}
  const nm=t('p_'+c.ty),k=c.ty+'|'+v,r=m.get(k);if(r)r.n++;else m.set(k,{nm,v,n:1})});
 if(!m.size)return;
 const q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[[t('bom_part'),t('bom_val'),t('bom_qty')].map(q).join(',')];
 [...m.values()].sort((a,b)=>a.nm.localeCompare(b.nm)).forEach(r=>rows.push([r.nm,r.v,r.n].map(q).join(',')));

function exportSVG(){const r=buildSVG();if(r)saveFile('zingo-circuit.svg',new Blob([r.svg],{type:'image/svg+xml'}),'text')}
function exportPNG(){
 const r=buildSVG();if(!r)return;const k=Math.min(2,4096/Math.max(r.w,r.h)),img=new Image();
 img.onload=()=>{try{const cvs=document.createElement('canvas');cvs.width=Math.round(r.w*k);cvs.height=Math.round(r.h*k);const g=cvs.getContext('2d');g.drawImage(img,0,0,cvs.width,cvs.height);
   const fin=b=>b?saveFile('zingo-circuit.png',b,'img'):fallbackSave('circuit.png',dataToBlob(cvs.toDataURL('image/png')),'img');
   if(cvs.toBlob)cvs.toBlob(fin,'image/png');else fin(null)}catch(e){Toast.show(t('n_export'))}};
 img.onerror=()=>Toast.show(t('n_export'));
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg)}
function dataToBlob(u){const a=u.split(','),bin=atob(a[1]),n=bin.length,b=new Uint8Array(n);for(let i=0;i<n;i++)b[i]=bin.charCodeAt(i);return new Blob([b],{type:'image/png'})}

/* ===== SECTION: Voltra AI (assistant, virtual lab, circuit actions, learning brain, community sync) ===== */
/* How it works
   - Talks to any OpenAI-compatible chat API (free built-in provider by default) or, in the Windows app, to Claude
     through the official SDK in the main process.
   - Every request carries a compact snapshot of the open circuit (parts, nets, live readings, detected problems),
     learned preferences and the most relevant things the brain knows.
   - Modes: Fast (one answer), Think (plan -> optional web search -> answer -> the proposed circuit is tested in a
     hidden virtual lab and repaired before it is shown), Loop (builds on the workspace in front of the user,
     simulates, reads the diagnosis and keeps fixing until the circuit works or the step limit is reached).
   - Changes come as ```zingo``` action blocks (add / wire / set / delete parts, Arduino code, new custom parts);
     a layout engine places the parts so they never pile up.
   - Learning: answers the user rates up, solutions that passed the virtual lab, fixes that removed a problem and
     confident answers are stored locally and, unless the user turns it off, sent to the community brain server. */

/* ---------- text tools (Arabic-aware normalisation, light stemming, TF-IDF cosine, character bigrams) ---------- */
const AIT=(()=>{
 const STOP=new Set(['ما','ماذا','من','هو','هي','في','علي','عن','الي','هل','كيف','لماذا','متي','اين','هذا','هذه','ذلك','كان','يكون','تكون','لي','انا','او','و','ان','مع','لا','ثم','اريد','ممكن','what','is','the','a','an','of','who','how','to','in','are','do','does','me','please','i','my','it','and','or','can','you','for','with','on','this','that','le','la','les','de','des','un','une','et','est','pour','que','qui','لو','سمحت','ارجو']);
 const norm=s=>String(s||'').toLowerCase().replace(/[\u064b-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
 const stem=w=>{if(w.length>4&&/^[وفبك]ال/.test(w))w=w.slice(3);else if(w.length>3&&w.startsWith('ال'))w=w.slice(2);
  if(w.length>4&&/(ات|ون|ين|ان)$/.test(w))w=w.slice(0,-2);else if(w.length>4&&/s$/.test(w))w=w.slice(0,-1);return w};
 const toks=s=>norm(s).split(/[^\p{L}\p{N}#+]+/u).filter(w=>w&&!STOP.has(w)).map(stem);
 const idfMap=docs=>{const df={};docs.forEach(d=>new Set(d).forEach(t=>df[t]=(df[t]||0)+1));const N=docs.length+1;return t=>Math.log(1+N/(1+(df[t]||0)))};
 const cos=(a,b,idf)=>{const fa={},fb={};a.forEach(t=>fa[t]=(fa[t]||0)+1);b.forEach(t=>fb[t]=(fb[t]||0)+1);let dot=0,na=0,nb=0;
  for(const t in fa){const w=idf(t);na+=(fa[t]*w)**2;if(fb[t])dot+=fa[t]*w*fb[t]*w}for(const t in fb)nb+=(fb[t]*idf(t))**2;return dot/(Math.sqrt(na*nb)||1)};
 const bgm=s=>{s=s.replace(/\s+/g,'');const r=new Map();let n=0;for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);r.set(k,(r.get(k)||0)+1);n++}return{r,n}};
 const dice=(a,b)=>{const A=bgm(a),B=bgm(b);if(!A.n||!B.n)return a===b?1:0;let k=0;A.r.forEach((v,t)=>{if(B.r.has(t))k+=Math.min(v,B.r.get(t))});return 2*k/(A.n+B.n)};
 const tokEst=s=>{s=String(s||'');let ar=0;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c>=1536&&c<=1791)ar++}return Math.ceil(ar/2.2+(s.length-ar)/3.4)};
 const cap=(s,n)=>{s=String(s||'');if(tokEst(s)<=n)return s;let lo=0,hi=s.length;while(lo<hi){const m=(lo+hi+1)>>1;if(tokEst(s.slice(0,m))<=n)lo=m;else hi=m-1}return s.slice(0,lo)+' …'};
 const h32=s=>{s=norm(s).replace(/\s+/g,' ').trim();let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
 /* personal data never leaves the computer: e-mails, phone numbers, URLs with tokens, Windows user paths, keys */
 const scrub=s=>String(s||'').replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[email]').replace(/(?:\+|00)?\d[\d\s-]{8,}\d/g,'[number]').replace(/https?:\/\/\S+/g,u=>/[?&](key|token|sig|auth)=/i.test(u)?'[link]':u).replace(/[A-Z]:\\Users\\[^\\\s]+/gi,'C:\\Users\\[user]').replace(/sk-[A-Za-z0-9_-]{12,}/g,'[key]');
 const noIds=s=>String(s).replace(/`?#\d+(?:\.[^\s`,)]+)?`?/g,'').replace(/\(\s*\)/g,'').replace(/[ \t]{2,}/g,' ');
 return{norm,toks,idfMap,cos,dice,tokEst,cap,h32,scrub,noIds}})();

const Brain={me:{v:1,facts:[],designs:[],rules:[],stats:{asked:0,learned:0,up:0,down:0,applied:0,fixed:0,auto:0},nid:1},net:{rev:0,facts:[],designs:[],rules:[]},outbox:[],ready:false,_t:0,
 async load(){const m=await AIStore.get('brain'),n=await AIStore.get('net'),o=await AIStore.get('outbox');
  if(m&&Array.isArray(m.facts))this.me=Object.assign(this.me,m,{stats:Object.assign({},this.me.stats,m.stats||{})});
  if(n&&Array.isArray(n.facts))this.net=Object.assign({rev:0,facts:[],designs:[],rules:[]},n);
  if(Array.isArray(o))this.outbox=o.slice(-400);this.ready=true},
 save(){clearTimeout(this._t);this._t=setTimeout(()=>{AIStore.set('brain',this.me);AIStore.set('outbox',this.outbox)},400)},
 find(list,q,th){const qt=AIT.toks(q);if(!qt.length)return null;const docs=list.map(f=>AIT.toks(f.q||f.name||'')),idf=AIT.idfMap(docs.concat([qt]));
  for(let i=0;i<docs.length;i++)if(AIT.cos(qt,docs[i],idf)>(th||.86))return list[i];return null},
 /* questions that only make sense for one particular circuit (quick buttons, automatic follow-ups) */
 generic(q){const n=AIT.norm(q).trim();return['ai_c_check_q','ai_c_explain_q','ai_q_fixafter'].some(k=>[I18N.en[k],I18N.ar[k],I18N.fr&&I18N.fr[k]].some(s=>s&&AIT.norm(s).trim()===n))},
 learnFact(q,a,kind,o){q=String(q||'').trim();a=String(a||'').trim();o=o||{};const gen=this.generic(q);
  if(gen){const ty=[...new Set(App.comps.filter(c=>c.ty!=='jn'&&!TY[c.ty].bb).map(c=>t('p_'+c.ty)))].slice(0,12).join(', ');if(ty)q+=' ['+ty+']'}
  if(q.length<4||a.length<8)return null;
  let f=this.find(this.me.facts,q);
  if(f){f.a=a;f.kind=kind||f.kind;f.up=(f.up||0)+(o.up||0);f.t=Date.now()}
  else{f={id:this.me.nid++,q:q.slice(0,600),a:a.slice(0,6000),kind:kind||'chat',up:o.up||0,down:0,uses:0,t:Date.now(),lang:LANG,src:o.src||'user'};this.me.facts.push(f);this.me.stats.learned++}
  if(this.me.facts.length>2500){this.me.facts.sort((x,y)=>((y.up||0)-(y.down||0)+(y.uses||0)*.2)-((x.up||0)-(x.down||0)+(x.uses||0)*.2));this.me.facts.length=2000}
  this.save();if(o.share!==false&&!gen)this.share({kind:f.kind,q:f.q,a:f.a,lang:LANG});return f},
 learnDesign(name,desc,kind,data,q){const d={id:this.me.nid++,name:String(name||'').slice(0,80),q:String(q||desc||name||'').slice(0,400),desc:String(desc||'').slice(0,600),kind,data,up:1,t:Date.now()};
  const old=this.find(this.me.designs,d.q,.9);if(old)Object.assign(old,d,{id:old.id,up:(old.up||0)+1});else this.me.designs.push(d);
  if(this.me.designs.length>300)this.me.designs.splice(0,this.me.designs.length-300);
  this.me.stats.applied++;this.save();if(!this.generic(q||''))this.share({kind:'design',q:d.q,a:d.desc,name:d.name,dkind:kind,data,lang:LANG});return d},
 vote(fid,v){const f=this.me.facts.find(x=>x.id===fid);if(!f)return;if(v>0)f.up=(f.up||0)+1;else f.down=(f.down||0)+1;
  if((f.down||0)>=2&&(f.down||0)>(f.up||0))this.me.facts=this.me.facts.filter(x=>x!==f);this.save()},
 PREFS:[[/(باختصار|اختصر|مختصر|briefly|short answer|be brief|en bref)/i,'ai_r_short'],[/(بالتفصيل|اشرح اكثر|شرح مفصل|in detail|explain more|en détail)/i,'ai_r_long'],
  [/(بالعربي|بالعربيه|in arabic)/i,'ai_r_ar'],[/(in english|بالانجليزي)/i,'ai_r_en'],[/(en français|بالفرنسي)/i,'ai_r_fr'],[/(بدون مقدمات|مباشره|get to the point|no intro)/i,'ai_r_direct'],
  [/(خطوه بخطوه|step by step|étape par étape)/i,'ai_r_steps'],[/(للمبتدئين|انا مبتدئ|beginner|débutant)/i,'ai_r_beginner'],[/(احترافي|مهندس|engineer|professional level|ingénieur)/i,'ai_r_pro']],
 learnPrefs(q){const n=AIT.norm(q);this.PREFS.forEach(([re,k])=>{if(re.test(n)||re.test(q)){const r=this.me.rules.find(x=>x.k===k);if(r){r.w++;r.t=Date.now()}else this.me.rules.push({k,w:1,t:Date.now()})}});
  if(this.me.rules.length>20){this.me.rules.sort((a,b)=>b.w-a.w);this.me.rules.length=20}this.save()},
 rulesText(){return this.me.rules.slice().sort((a,b)=>b.w-a.w).slice(0,6).map(r=>'- '+t(r.k)).join('\n')},
 recall(q,k){const qt=AIT.toks(q);if(!qt.length)return[];const pool=[];
  this.me.facts.forEach(f=>pool.push({f,src:'me',d:AIT.toks(f.q)}));this.net.facts.forEach(f=>pool.push({f,src:'net',d:AIT.toks(f.q)}));
  this.me.designs.forEach(f=>pool.push({f,src:'me',d:AIT.toks(f.q+' '+f.name),design:1}));this.net.designs.forEach(f=>pool.push({f,src:'net',d:AIT.toks((f.q||'')+' '+(f.name||'')),design:1}));
  if(!pool.length)return[];const idf=AIT.idfMap(pool.map(p=>p.d).concat([qt])),qj=qt.join(' ');
  pool.forEach(p=>{let s=.75*AIT.cos(qt,p.d,idf)+.25*AIT.dice(qj,p.d.join(' '));const f=p.f;s*=1+Math.min(f.up||f.votes||0,5)*.06;s-=(f.down||0)*.12;if(p.src==='net')s*=.92;if(f.kind==='fix')s*=1.05;p.s=s});
  return pool.filter(p=>p.s>.28).sort((a,b)=>b.s-a.s).slice(0,k||4)},
 /* community sharing: on by default; scrubbed of personal data and part numbers; each item is sent once */

  x.q=AIT.noIds(AIT.scrub(x.q)).slice(0,600);if(x.a)x.a=AIT.noIds(AIT.scrub(x.a)).slice(0,6000);if(x.name)x.name=AIT.scrub(x.name).slice(0,80);

/* ---------- circuit snapshot for the model ---------- */
function aiNodeName(n){return n===0?'0V':n>0?'N'+n:'open'}   /* 0V = ground, or the reference of a circuit without a ground symbol */
function aiPropText(c){const T=TY[c.ty];return(T.props||[]).filter(p=>p.k!=='bs'&&p.k!=='lg').map(p=>{const v=P(c,p.k);if(v==null)return'';return p.k+'='+(p.t==='num'&&T.u&&p.k==='v'?fmtU(v,T.u):(typeof v==='number'?+(+v).toPrecision(4):v))}).filter(Boolean).join(' ')}
function aiReading(c){const r=c._r||{};const num=x=>typeof x==='number'&&Number.isFinite(x);
 const sm=(x,m,q,u)=>{if(!num(m)||!num(q))return num(x)?si(x,u):'';const a=Math.sqrt(Math.max(0,q-m*m));return a>.05*Math.abs(m)&&a>1e-9?(a>Math.abs(m)?'~'+si(a,u):si(m,u)+' (ripple '+si(a,u)+')'):si(num(x)?x:m,u)};
 if(c.ty==='vm')return'shows '+meterTxt(r,'v','V',+P(c,'cpl'));if(c.ty==='am')return'shows '+meterTxt(r,'i','A',+P(c,'cpl'));if(c.ty==='mm')return'shows '+mmTxt(c,r);
 const a=[];if(num(r.v))a.push('V='+sm(r.v,r.sv,r.sv2,'V'));if(num(r.i))a.push('I='+sm(r.i,r.si,r.si2,'A'));if(num(r.p)&&r.p>1e-6)a.push('P='+si(num(r.sp)?r.sp:r.p,'W'));return a.join(' ')}
function aiStress(c,sim){sim=sim||Run.sim;const ws=sim&&sim.watch?sim.watch.filter(w=>w.c===c):[];let s=0;ws.forEach(w=>{let q=w.q;if(q==null)try{q=w.f()}catch(e){q=0}if(Number.isFinite(q)&&q>s)s=q});return ws.length?Math.round(s*100):null}
function aiSnapshot(maxParts){
 try{if(Run.dirty)Run.rebuild()}catch(e){}
 const sm=Run.sim,nd=(c,j)=>sm&&sm.nodeOf?sm.nodeOf(c.id+'.'+j):-1,L=[];
 const comps=App.comps.filter(c=>c.ty!=='jn'&&!TY[c.ty].bb);
 L.push('Project: '+Proj.title()+' | view: '+(App.mode==='sch'?'schematic':'breadboard')+' | status: '+t('s_'+(Run.stat||Run.status()))+' | sim t='+(sm?sm.t.toFixed(2):0)+'s');
 if(!comps.length){L.push('The workspace is empty.');return L.join('\n')}
 const sel=new Set(App.sel);
 comps.slice(0,maxParts||120).forEach(c=>{const T=TY[c.ty];
