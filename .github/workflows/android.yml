name: pyreels-android

on:
  push:
    branches: ["claude/**", "main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    env:
      PYREELS_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      PYREELS_BUILD_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug + release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: pyreels-studio-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk

  instrumented:
    name: Instrumented tests (emulator)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYREELS_BUILD_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb pull /sdcard/Android/data/studio.pyreels.app/files/snapshots snapshots || true
            for f in snapshots/*.jpg; do echo "SNAP-BEGIN $(basename $f)"; base64 -w 4000 "$f"; echo "SNAP-END"; done || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-snapshots
          path: snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: app/build/reports/androidTests
