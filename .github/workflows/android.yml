name: pyreels-android

on:
  push:
    branches: ["claude/**", "main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    env:
      PYREELS_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYREELS_BUILD_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug + release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: pyreels-studio-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Publish the APK as a GitHub release (direct download)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PyReelsStudio.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk PyReelsStudio.apk --prerelease --target "${{ github.sha }}" \
            --title "PyReels Studio - latest build" \
            --notes "Install PyReelsStudio.apk (Android 10 or newer). Built from commit ${{ github.sha }}."
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk

  instrumented:
    # Android 10 (minSdk), 12 (the creator's phone) and 14 (latest behaviour changes)
    name: Instrumented tests (Android ${{ matrix.api }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34]
    env:
      PYREELS_BUILD_PYTHON: python3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests_failed
            mkdir -p snapshots && adb exec-out run-as studio.pyreels.app tar c files/snapshots > snapshots/s.tar && tar xf snapshots/s.tar -C snapshots --strip-components=2 || true
            [ "${{ matrix.api }}" != "34" ] || for f in snapshots/*.jpg; do echo "SNAP-BEGIN $(basename $f)"; base64 -w 4000 "$f"; echo "SNAP-END"; done || true
            adb logcat -d -b crash | tail -80 || true
            adb logcat -d | grep -E "PyReelsTest|PyReelsExport|AndroidRuntime|FATAL EXCEPTION|am_proc_died|ANR in" | tail -120 || true
            [ "${{ matrix.api }}" != "31" ] || bash ci/smoke_release.sh || touch tests_failed
            test ! -f tests_failed
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-snapshots-${{ matrix.api }}
          path: snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.api }}
          path: app/build/reports/androidTests
