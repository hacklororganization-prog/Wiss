name: ZINGO Fast - Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'zingo-fast/**'
      - '.github/workflows/zingo-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zingo-fast/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ZINGO-Fast-Setup
          path: zingo-fast/desktop/dist/*.exe
          if-no-files-found: error
